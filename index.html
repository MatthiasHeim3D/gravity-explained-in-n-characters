<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gravity explained in n characters</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An LLM experiment: gravity explained at whatever length fits inside a box you resize yourself.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light dark;

  --bg:          #f2f1ef;
  --bg-grid:     rgba(28, 25, 23, .045);
  --paper:       #ffffff;
  --ink:         #1b1a19;
  --muted:       #6f6b66;
  --line:        #ddd8d2;
  --accent:      #5b5bd6;
  --accent-ring: rgba(91, 91, 214, .22);
  --water:       rgba(64, 157, 204, .13);
  --water-deep:  rgba(64, 157, 204, .23);
  --water-line:  rgba(54, 145, 194, .48);
  --glass-line:  rgba(100, 151, 174, .48);
  --soil:        #7d5c3d;
  --soil-deep:   #5b422a;
  --shore:       #6f9247;
  --shore-deep:  #56742f;
  --reed:        #7f9d55;
  --reed-head:   #8d6b3e;
  --soil-grit:   #a8825a;
  --soil-stone:  #9a8874;
  --shadow:      0 1px 2px rgba(28,25,23,.05), 0 10px 30px -12px rgba(28,25,23,.28);
  --shadow-lift: 0 1px 2px rgba(28,25,23,.06), 0 18px 40px -14px rgba(28,25,23,.36);

  --radius: 12px;
  --lake-bed: 26px;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:          #12110f;
    --bg-grid:     rgba(245, 240, 235, .05);
    --paper:       #1c1a18;
    --ink:         #eceae7;
    --muted:       #97918a;
    --line:        #34302c;
    --accent:      #8f8bff;
    --accent-ring: rgba(143, 139, 255, .26);
    --water:       rgba(80, 173, 218, .13);
    --water-deep:  rgba(80, 173, 218, .24);
    --water-line:  rgba(105, 196, 235, .48);
    --glass-line:  rgba(104, 169, 196, .45);
    --soil:        #4a3626;
    --soil-deep:   #33251a;
    --shore:       #4d6b34;
    --shore-deep:  #3a5326;
    --reed:        #5f7c3f;
    --reed-head:   #6f5433;
    --soil-grit:   #6b5138;
    --soil-stone:  #7a6a58;
    --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 30px -12px rgba(0,0,0,.7);
    --shadow-lift: 0 1px 2px rgba(0,0,0,.55), 0 18px 40px -14px rgba(0,0,0,.8);
  }
}

/* ---------------------------------------------------------------- layout */
* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  padding:
    max(16px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(0px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

/* ---------------------------------------------------------------- header */
.masthead {
  position: relative;
  flex: none;
  text-align: center;
  padding-bottom: 14px;
}

.title {
  margin: 0;
  padding-inline: 36px;
  font-family: var(--mono);
  font-size: clamp(1.05rem, 3.6vw, 1.6rem);
  font-weight: 600;
  letter-spacing: -.01em;
  line-height: 1.3;
}

.github-link {
  position: absolute;
  top: -4px;
  right: 0;
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  color: var(--muted);
  transition: color .15s ease, background-color .15s ease;
}
.github-link:hover { color: var(--ink); background: var(--accent-ring); }
.github-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.github-link svg { width: 18px; height: 18px; fill: currentColor; }

#charCount {
  display: inline-block;
  min-width: 1.2em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.hint {
  margin: 8px 0 0;
  min-height: 1.35em;
  font-size: clamp(.78rem, 2.4vw, .875rem);
  color: var(--muted);
}

/* ----------------------------------------------------------------- stage */
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

/* ------------------------------------------------------------------ lake */
#lake {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease;
}

#lake.is-ready { opacity: 1; }

.soil-top    { stop-color: var(--soil); }
.soil-bottom { stop-color: var(--soil-deep); }

#lakeGround { fill: url(#soilFill); }
#lakeShore  { fill: var(--shore); }
#lakeWater  { fill: url(#waterFill); }

.water-top    { stop-color: var(--water); }
.water-bottom { stop-color: var(--water-deep); }

#lakeGrit   { stroke: var(--soil-grit);  stroke-width: 1.4; opacity: .8; }
#lakeStones { stroke: var(--soil-stone); stroke-width: 2.8; opacity: .85; }

#lakeSurface {
  fill: none;
  stroke: var(--water-line);
  stroke-width: 1;
}

#lakeGrass, #lakeReedStems, #lakeReedHeads, #lakeGrit, #lakeStones {
  fill: none;
  stroke-linecap: round;
}

#lakeGrass     { stroke: var(--shore-deep); stroke-width: 1.4; }
#lakeReedStems { stroke: var(--reed);       stroke-width: 1.6; }
#lakeReedHeads { stroke: var(--reed-head);  stroke-width: 3.6; }

/* ------------------------------------------------------------------- box */
/* The water body. Everything that makes it read as a lake -- the earth, the
   banks, the greenery -- is drawn behind it in #lake, so this stays a plain
   rectangle and the text layout and physics vessel are unchanged. Above the
   waterline it is transparent, which is what lets the far bank and the reeds
   standing in the shallows show through. */
#box {
  --waterline-y: 16px;
  position: absolute;
  z-index: 1;
  top: auto;
  bottom: var(--lake-bed);
  left: 0;
  width: 340px;
  height: 220px;
  padding: 16px;
  opacity: 0;
  transition: opacity .35s ease;
}

#box.is-ready { opacity: 1; }

#boxContent {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.45;
  text-align: justify;
  hyphens: none;
  word-break: normal;
  overflow-wrap: break-word;
  overflow: hidden;
}

.text-line {
  position: absolute;
  display: block;
  white-space: nowrap;
  overflow: hidden;
}

.text-line.is-justified {
  text-align: justify;
  text-align-last: justify;
}

.apple {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  cursor: grab;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
  filter: drop-shadow(0 4px 3px rgba(28, 25, 23, .2));
  will-change: transform;
}

.apple > img {
  position: absolute;
  display: block;
  max-width: none;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
}

.apple.is-dragging { cursor: grabbing; }

.physics-debug-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
}

/* Every splash on screen shares this one layer. ASCII art cannot be alpha
   blended, so two splashes that overlap are composited onto a single character
   grid rather than stacked as separate elements. The layer spans the viewport
   and never moves: glyphs change cells, nothing translates. */
.ascii-splash {
  --splash-row: 9px;   /* one row of the character grid */
  position: fixed;
  left: 0;
  z-index: 9;
  margin: 0;
  pointer-events: none;
  color: var(--water-line);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  line-height: var(--splash-row);
  white-space: pre;
  text-shadow: 0 1px 5px var(--water);
  /* Lift the grid by its 8 rows, give back half a row to centre the water-line
     row on the anchor, then 1.5px more because a tilde draws above that centre. */
  transform: translateY(calc(-7.5 * var(--splash-row) + 1.5px));
}

@media (pointer: coarse) {
  #box { --waterline-y: 14px; padding: 14px; }
  #boxContent { font-size: 14px; }
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

</style>
</head>
<body>

<header class="masthead">
  <h1 class="title">Gravity explained in <span id="charCount">n</span> characters</h1>
  <p class="hint" id="hint">Drop ten rocks, then a fish, then a duck. Apples follow. Drag anything around.</p>
  <a class="github-link" href="https://github.com/MatthiasHeim3D/gravity-explained-in-n-characters" target="_blank" rel="noopener" aria-label="View source on GitHub">

  </a>
</header>

<main id="stage">
  <!-- Drawn from the water's rectangle by renderLake(); empty until then. -->
  <svg id="lake" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 100">
    <defs>
      <linearGradient id="soilFill" x1="0" y1="0" x2="0" y2="1">
        <stop class="soil-top" offset="0"/>
        <stop class="soil-bottom" offset="1"/>
      </linearGradient>
      <linearGradient id="waterFill" x1="0" y1="0" x2="0" y2="1">
        <stop class="water-top" offset="0"/>
        <stop class="water-bottom" offset="1"/>
      </linearGradient>
      <clipPath id="soilClip"><path id="lakeGroundClip"/></clipPath>
    </defs>
    <path id="lakeGround"/>
    <g clip-path="url(#soilClip)">
      <path id="lakeGrit"/>
      <path id="lakeStones"/>
    </g>
    <path id="lakeShore"/>
    <path id="lakeWater"/>
    <path id="lakeSurface"/>
    <path id="lakeGrass"/>
    <path id="lakeReedStems"/>
    <path id="lakeReedHeads"/>
  </svg>

  <section id="box" aria-label="Lake holding the explanation">
    <p id="boxContent"></p>
  </section>
</main>

<p id="status" class="sr-only" role="status" aria-live="polite"></p>

<script src="lookup_table.js"></script>

<script src="vendor/physics.js"></script>
<script src="vendor/pretext.js"></script>
<script>
var layoutText = Pretext.layout;
var layoutNextLine = Pretext.layoutNextLine;
var measureNaturalWidth = Pretext.measureNaturalWidth;
var prepareWithSegments = Pretext.prepareWithSegments;

(function () {
  'use strict';

  var stage   = document.getElementById('stage');
  var box     = document.getElementById('box');
  var content = document.getElementById('boxContent');
  var countEl = document.getElementById('charCount');
  var statusEl = document.getElementById('status');
  var lake = document.getElementById('lake');
  var lakeGround = document.getElementById('lakeGround');
  var lakeGroundClip = document.getElementById('lakeGroundClip');
  var lakeGrit = document.getElementById('lakeGrit');
  var lakeStones = document.getElementById('lakeStones');
  var lakeWater = document.getElementById('lakeWater');
  var lakeSurface = document.getElementById('lakeSurface');
  var lakeShore = document.getElementById('lakeShore');
  var lakeGrass = document.getElementById('lakeGrass');
  var lakeReedStems = document.getElementById('lakeReedStems');
  var lakeReedHeads = document.getElementById('lakeReedHeads');

  // Flatten the lookup table once into parallel arrays sorted by budget.
  var KEYS = Object.keys(window.lookupTable)
    .map(Number)
    .filter(function (n) { return isFinite(n); })
    .sort(function (a, b) { return a - b; });
  var TEXTS = KEYS.map(function (k) { return String(window.lookupTable[k]); });
  // Pretext follows white-space: normal, so repeated whitespace is one cell.
  // Keeping these lengths lets us discard entries that cannot possibly fit
  // before doing any text layout work.
  var NORMALIZED_LENGTHS = TEXTS.map(function (text) {
    return text.trim().replace(/\s+/g, ' ').length;
  });

  var minW = 48, minH = 44;
  var padX = 0, padY = 0;
  var lineHeight = 21.75;
  var cellWidth = 9;
  var pretextFont = '';
  var pretextOptions = { letterSpacing: 0 };
  var preparedTexts = new Array(TEXTS.length);
  var flowLineEls = [];
  var apples = [];

  var LAKE_BED = 26;          // earth kept below the water, so it has a floor
  var LAKE_MIN_BANK = 34;     // a lake without a shore is a swimming pool
  var LAKE_MAX_BANK = 130;
  var LAKE_MAX_WATER = 720;   // wide screens stop widening the water here
  var LAKE_CREST = 34;        // how far the bank climbs above the waterline
  var LAKE_CURVE_STEPS = 18;  // segments per bank, for the collider line
  var LAKE_SOIL = 13;         // depth of the green layer over the brown

  // Vegetation is placed from a fixed pool of random numbers rather than fresh
  // ones, so resizing slides the grass along the shore instead of reshuffling
  // it into a different meadow on every pointer move.
  var lakeNoise = [];
  for (var seed = 0; seed < 256; seed++) lakeNoise.push(Math.random());

  var APPLE_COLLISION_RADIUS = 19.5;
  var EARTH_GRAVITY = 9.80665;       // m/s², standard gravity
  var APPLE_MASS_KG = 0.18;          // a medium 180 g apple
  var APPLE_RADIUS_METERS = 0.04;    // 8 cm physical diameter
  var STONE_DENSITY = 2700;          // kg/m³, typical solid rock
  var DUCK_REFERENCE_WIDTH = 0.50;
  var DUCK_PHYSICAL_WIDTH = 0.20;     // compact display scale
  var DUCK_SCALE = DUCK_PHYSICAL_WIDTH / DUCK_REFERENCE_WIDTH;
  var DUCK_MASS_KG = 0.95 * Math.pow(DUCK_SCALE, 3);
  var DUCK_HYDRO_RADIUS = 0.065 * DUCK_SCALE;
  var DUCK_VOLUME_M3 = 0.0018 * Math.pow(DUCK_SCALE, 3);
  var FISH_PHYSICAL_WIDTH = 0.18;
  var FISH_HYDRO_RADIUS = 0.055;
  var FISH_MASS_KG = 0.12;
  var FISH_VOLUME_M3 = 0.00012;       // 120 g of displaced fresh water
  var STONE_MIN_SCALE = 0.5;
  var STONE_MAX_SCALE = 2;
  var WATER_DENSITY = 1000;          // kg/m³ at ordinary conditions
  var WATER_DYNAMIC_VISCOSITY = 0.001; // Pa·s at about 20 °C
  var APPLE_DRAG_COEFFICIENT = 0.47; // approximately spherical
  var STONE_DRAG_COEFFICIENT = 0.8;  // irregular/bluff body
  var DUCK_DRAG_COEFFICIENT = 0.6;
  var FISH_DRAG_COEFFICIENT = 0.2;   // streamlined side profile
  var APPLE_ROTATIONAL_DRAG = 0.2;
  var STONE_ROTATIONAL_DRAG = 0.8;
  var DUCK_ROTATIONAL_DRAG = 1.1;
  var FISH_ROTATIONAL_DRAG = 0.6;
  var AIR_LINEAR_DAMPING = 0.001;
  var AIR_ANGULAR_DAMPING = 0.001;
  var WATER_LINEAR_DAMPING = 2.5;
  var WATER_ANGULAR_DAMPING = 1.2;
  var TEXT_HULL_OFFSET = 4;
  var PIXELS_PER_METER = APPLE_COLLISION_RADIUS / APPLE_RADIUS_METERS;
  // Planck's 5 mm default tolerance is intended for roughly metre-sized
  // bodies. Here it creates a 4.875 px skin around every small hull. A 0.1 mm
  // tolerance keeps continuous contacts robust while reducing that skin to
  // less than one tenth of a pixel per collider.
  var PHYSICS_LINEAR_SLOP = 0.0001;
  var PHYSICS_STEP = 1 / 120;
  var WALL_THICKNESS = 24;

  // Visible bounds and convex hulls measured from the downloaded Noto Color
  // Emoji SVG alpha. Apple hulls start at y=28 so the decorative leaf and stem
  // remain visible without becoming load-bearing collision parts. The duck and
  // fish are compound so their transparent gaps do not become solid colliders.
  var NOTO_EMOJI = {
    redApple: {
      src: 'assets/noto-color-emoji/red-apple.svg',
      bounds: { x: 7, y: 3, width: 114, height: 122 },
      hull: [[9,54], [38,28], [100,28], [120,55], [115,91], [96,116], [48,124], [20,107]]
    },
    greenApple: {
      src: 'assets/noto-color-emoji/green-apple.svg',
      bounds: { x: 7, y: 6, width: 113, height: 118 },
      hull: [[11,49], [34,28], [95,28], [119,59], [115,92], [82,123], [31,117], [11,90]]
    },
    rock: {
      src: 'assets/noto-color-emoji/rock.svg',
      bounds: { x: 6, y: 7, width: 112, height: 116 },
      hull: [[19,46], [59,12], [84,8], [112,52], [117,98], [74,122], [24,114], [6,85]]
    },
    duck: {
      src: 'assets/noto-color-emoji/duck.svg',
      bounds: { x: 7, y: 4, width: 109, height: 96 },
      hulls: [
        [[26,63], [37,45], [109,45], [114,52], [115,67], [109,82],
         [95,94], [74,99], [57,99], [44,96], [30,86], [26,77]],
        [[28,16], [35,8], [43,4], [54,4], [60,7], [65,13],
         [67,25], [61,40], [40,40], [28,30]],
        [[35,30], [62,30], [59,54], [52,59], [39,57], [33,50]],
        [[7,22], [8,21], [10,20], [28,16], [30,16], [31,17],
         [32,30], [19,30], [15,29], [12,28], [8,26], [7,25]]
      ]
    },
    fish: {
      src: 'assets/noto-color-emoji/fish.svg',
      bounds: { x: 5, y: 27, width: 119, height: 81 },
      hulls: [
        [[5,73], [13,61], [23,51], [45,41], [79,41], [104,71],
         [104,82], [89,106], [50,106], [32,102], [21,96], [8,85]],
        [[42,44], [47,37], [56,28], [59,28], [66,31], [72,35],
         [79,41], [85,48], [88,52], [96,64], [96,65], [42,65]],
        [[96,64], [122,53], [123,54], [123,55], [121,63], [118,69],
         [113,78], [96,78]],
        [[100,74], [113,74], [120,88], [121,91], [122,95], [120,95],
         [118,94], [100,83]]
      ]
    }
  };

  Physics.Settings.linearSlop = PHYSICS_LINEAR_SLOP;

  var physicsWorld = new Physics.World({
    gravity: Physics.Vec2(0, EARTH_GRAVITY)
  });
  physicsWorld.setAllowSleeping(true);
  physicsWorld.setContinuousPhysics(true);
  var dragAnchorBody = physicsWorld.createBody();
  var vesselBodies = [];
  var vesselDebugShapes = [];
  var activeDrags = Object.create(null);
  var physicsDebugCanvas = null;
  var physicsDebugEnabled = false;
  var physicsDebugAllowed = !/(^|\.)gitlab\.io$/i.test(window.location.hostname) &&
    window.location.hostname.toLowerCase() !== 'matthiasheim3d.github.io';
  var spawnCount = 0;

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function makeCollisionHull(asset, physicalWidth) {
    var profiles = asset.hulls || [asset.hull];
    var metersPerSourcePixel = physicalWidth / asset.bounds.width;
    var originX = asset.bounds.x + asset.bounds.width / 2;
    var originY = asset.bounds.y + asset.bounds.height / 2;
    var totalArea = 0;
    var minY = Infinity;
    var maxY = -Infinity;
    var hulls = [];

    for (var h = 0; h < profiles.length; h++) {
      var profile = profiles[h];
      var twiceArea = 0;
      for (var i = 0; i < profile.length; i++) {
        var current = profile[i];
        var next = profile[(i + 1) % profile.length];
        twiceArea += current[0] * next[1] - next[0] * current[1];
        minY = Math.min(minY, current[1]);
        maxY = Math.max(maxY, current[1]);
      }
      totalArea += Math.abs(twiceArea) * metersPerSourcePixel * metersPerSourcePixel / 2;
      hulls.push(profile.map(function (point) {
        return Physics.Vec2(
          (point[0] - originX) * metersPerSourcePixel,
          (point[1] - originY) * metersPerSourcePixel
        );
      }));
    }

    return {
      area: totalArea,
      hulls: hulls,
      top: (originY - minY) * metersPerSourcePixel * PIXELS_PER_METER,
      bottom: (maxY - originY) * metersPerSourcePixel * PIXELS_PER_METER
    };
  }

  // Area of the circular projection below the waterline. This is the frontal
  // area seen by the flow and is not the same as displaced-volume fraction.
  function submergedProjectedArea(radius, depth) {
    if (depth <= 0) return 0;
    if (depth >= radius * 2) return Math.PI * radius * radius;
    var offset = radius - depth;
    return radius * radius * Math.acos(offset / radius) -
      offset * Math.sqrt(Math.max(0, 2 * radius * depth - depth * depth));
  }

  /* ------------------------------------------------------------- metrics */

  function canvasFont(cs) {
    var parts = [];
    if (cs.fontStyle !== 'normal') parts.push(cs.fontStyle);
    if (cs.fontVariant !== 'normal') parts.push(cs.fontVariant);
    parts.push(cs.fontWeight, cs.fontSize, cs.fontFamily);
    return parts.join(' ');
  }

  // Derive the smallest sensible box and synchronize Pretext with the live
  // typography. Prepared text remains cached until that typography changes.
  function measure() {
    var bs = getComputedStyle(box);
    var cs = getComputedStyle(content);

    padX = parseFloat(bs.paddingLeft) + parseFloat(bs.paddingRight);
    padY = parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom);
    var borderX = parseFloat(bs.borderLeftWidth) + parseFloat(bs.borderRightWidth);
    var borderY = parseFloat(bs.borderTopWidth) + parseFloat(bs.borderBottomWidth);

    var fontSize = parseFloat(cs.fontSize) || 15;
    lineHeight = parseFloat(cs.lineHeight);
    if (!isFinite(lineHeight)) lineHeight = fontSize * 1.45;

    minH = Math.ceil(lineHeight + padY + borderY);
    minW = Math.ceil(fontSize * 0.65 + padX + borderX);

    var font = canvasFont(cs);
    var letterSpacing = parseFloat(cs.letterSpacing);
    if (!isFinite(letterSpacing)) letterSpacing = 0;

    if (font !== pretextFont || letterSpacing !== pretextOptions.letterSpacing) {
      pretextFont = font;
      pretextOptions = { letterSpacing: letterSpacing };
      preparedTexts = new Array(TEXTS.length);

      // The displayed typeface is monospace, so one measured cell gives an
      // exact upper bound on how many normalized characters the box can hold.
      var cell = prepareWithSegments('0', pretextFont, pretextOptions);
      cellWidth = measureNaturalWidth(cell) || fontSize * 0.6;
    }
  }

  /* ------------------------------------------------------------ geometry */

  function stageW() { return stage.clientWidth; }
  function stageH() { return stage.clientHeight; }

  // The lake is no longer draggable: its size falls out of the viewport alone.
  // Width grows with the stage up to a cap so a wide monitor does not stretch
  // it into a canal; height is the lower two thirds, less the earth beneath.
  function layoutLake() {
    var w = clamp(Math.min(LAKE_MAX_WATER, stageW() - LAKE_MIN_BANK * 2),
                  minW, Math.max(minW, stageW() - LAKE_MIN_BANK * 2));
    var h = clamp(stageH() * 2 / 3 - LAKE_BED, minH, Math.max(minH, stageH() - LAKE_BED));

    box.style.left   = Math.round((stageW() - w) / 2) + 'px';
    box.style.top    = '';
    box.style.width  = Math.round(w) + 'px';
    box.style.height = Math.round(h) + 'px';

    renderLake();
    syncVesselBodies();
    wakeApples();
  }

  /* ---------------------------------------------------------------- basin */

  // The floor is a shallow bowl: deepest on the centre line, sweeping up into
  // each wall so the bottom corners round off. One curve defines the shape,
  // and the water fill, the earth's notch, the physics floor and the text all
  // read from it, so they cannot drift apart.
  function basinRise(width, height) {
    return Math.min(clamp(width * 0.085, 14, 58), Math.max(0, height * 0.34));
  }

  // Depth lost at horizontal position x, measured from the box's own bottom.
  function basinLift(x, width, rise) {
    var half = width / 2;
    if (half <= 0) return 0;
    var u = Math.min(1, Math.abs(x - half) / half);
    return rise * Math.pow(u, 2.6);
  }

  // The floor as a list of points across the box, left to right.
  function basinPoints(width, bottomY, rise, steps) {
    var points = [];
    for (var i = 0; i <= steps; i++) {
      var x = width * i / steps;
      points.push({ x: x, y: bottomY - basinLift(x, width, rise) });
    }
    return points;
  }

  /* ----------------------------------------------------------------- lake */

  // The lake is drawn, never laid out. Everything here comes out of one
  // geometry, measured in viewport coordinates -- the same space the physics
  // bodies live in, so the picture and the colliders cannot drift apart. The
  // water keeps its maximum width; the shore always runs on to both edges of
  // the browser, flat once it has climbed to the crest.

  function lakeRandom(i) { return lakeNoise[i % lakeNoise.length]; }
  function round1(v) { return Math.round(v * 10) / 10; }

  // A bank, as a cubic from the crest down to the water's edge: it lies almost
  // flat where it meets the flat shore, then rolls over and drops in.
  function shoreCurve(outerX, crestY, waterX, waterY) {
    var run = waterX - outerX;
    var fall = waterY - crestY;
    return {
      x0: outerX,               y0: crestY,
      x1: outerX + run * 0.44,  y1: crestY + fall * 0.06,
      x2: waterX - run * 0.26,  y2: crestY + fall * 0.74,
      x3: waterX,               y3: waterY
    };
  }

  function curveAt(c, t, axis) {
    var u = 1 - t;
    return u * u * u * c[axis + '0'] + 3 * u * u * t * c[axis + '1'] +
           3 * u * t * t * c[axis + '2'] + t * t * t * c[axis + '3'];
  }

  function curvePoint(c, t) {
    return { x: curveAt(c, t, 'x'), y: curveAt(c, t, 'y') };
  }

  function curveDown(c) {   // crest -> water
    return 'C' + round1(c.x1) + ',' + round1(c.y1) +
           ' ' + round1(c.x2) + ',' + round1(c.y2) +
           ' ' + round1(c.x3) + ',' + round1(c.y3);
  }

  function curveUp(c) {     // the same bank walked water -> crest
    return 'C' + round1(c.x2) + ',' + round1(c.y2) +
           ' ' + round1(c.x1) + ',' + round1(c.y1) +
           ' ' + round1(c.x0) + ',' + round1(c.y0);
  }

  function lakeGeometry() {
    var rect = box.getBoundingClientRect();
    var sw = window.innerWidth, sh = window.innerHeight;
    if (rect.width <= 0 || rect.height <= 0 || sw <= 0 || sh <= 0) return null;

    var waterY = content.getBoundingClientRect().top;
    var crestY = Math.max(0, waterY - LAKE_CREST);
    var bank = clamp((sw - rect.width) / 2, LAKE_MIN_BANK, LAKE_MAX_BANK);
    var crestL = Math.max(0, rect.left - bank);
    var crestR = Math.min(sw, rect.right + bank);

    var floor = basinPoints(rect.width, rect.bottom,
                            basinRise(rect.width, rect.bottom - waterY), 40);
    for (var i = 0; i < floor.length; i++) floor[i].x += rect.left;

    return {
      sw: sw, sh: sh, bank: bank,
      waterL: rect.left, waterR: rect.right, waterY: waterY, bottomY: rect.bottom,
      crestY: crestY, crestL: crestL, crestR: crestR,
      left: shoreCurve(crestL, crestY, rect.left, waterY),
      right: shoreCurve(crestR, crestY, rect.right, waterY),
      floor: floor
    };
  }

  // The ground line from one edge of the browser to the other: flat shore,
  // bank, the wall down into the water, the bed, and back up the far side.
  // Both the colliders and nothing else read this -- the drawing rebuilds the
  // same shape in path form, from the same geometry.
  function terrainPoints(g) {
    var points = [{ x: -WALL_THICKNESS, y: g.crestY }, { x: g.crestL, y: g.crestY }];
    var i;

    for (i = 1; i <= LAKE_CURVE_STEPS; i++) {
      points.push(curvePoint(g.left, i / LAKE_CURVE_STEPS));
    }
    for (i = 0; i < g.floor.length; i++) points.push(g.floor[i]);
    points.push({ x: g.waterR, y: g.waterY });
    for (i = LAKE_CURVE_STEPS - 1; i >= 0; i--) {
      points.push(curvePoint(g.right, i / LAKE_CURVE_STEPS));
    }
    points.push({ x: g.sw + WALL_THICKNESS, y: g.crestY });

    return points;
  }

  // The green skin over the brown: the shore line, and the same line dropped
  // by the soil depth, closed into a band.
  function shoreBand(c) {
    return 'M' + round1(c.x0) + ',' + round1(c.y0) + curveDown(c) +
           'L' + round1(c.x3) + ',' + round1(c.y3 + LAKE_SOIL) +
           'C' + round1(c.x2) + ',' + round1(c.y2 + LAKE_SOIL) +
           ' ' + round1(c.x1) + ',' + round1(c.y1 + LAKE_SOIL) +
           ' ' + round1(c.x0) + ',' + round1(c.y0 + LAKE_SOIL) + 'Z';
  }

  function flatBand(x0, x1, y) {
    if (x1 - x0 <= 0) return '';
    return 'M' + round1(x0) + ',' + round1(y) + 'L' + round1(x1) + ',' + round1(y) +
           'L' + round1(x1) + ',' + round1(y + LAKE_SOIL) +
           'L' + round1(x0) + ',' + round1(y + LAKE_SOIL) + 'Z';
  }

  function blade(x, y, key, grass) {
    var height = 6 + lakeRandom(key + 61) * 9;
    var lean = (lakeRandom(key + 127) - 0.5) * height * 1.1;
    grass.push('M' + round1(x) + ',' + round1(y) +
      'Q' + round1(x + lean * 0.3) + ',' + round1(y - height * 0.62) +
      ' ' + round1(x + lean) + ',' + round1(y - height));
  }

  // Grass along the flat run of shore, at the same density as the bank.
  function plantFlat(x0, x1, y, key, grass) {
    var span = x1 - x0;
    var blades = Math.round(span / 6);
    for (var i = 0; i < blades; i++) {
      blade(x0 + span * (i + lakeRandom(key + i)) / blades, y, key + i, grass);
    }
  }

  // Grass over the whole bank, reeds gathered down at the waterline where a
  // few of them wade out into the shallows.
  function plantBank(c, bank, key, grass, stems, heads) {
    var toWater = c.x3 > c.x0 ? 1 : -1;
    var blades = Math.max(4, Math.round(bank / 6));
    var i, t, base, baseX, baseY, height, lean;

    for (i = 0; i < blades; i++) {
      t = Math.min(0.99, 0.05 + (i + lakeRandom(key + i)) / blades * 0.92);
      base = curvePoint(c, t);
      blade(base.x, base.y, key + i, grass);
    }

    var count = Math.max(2, Math.round(bank / 30));
    for (i = 0; i < count; i++) {
      t = Math.min(1, 0.6 + (i + lakeRandom(key + i + 17)) / count * 0.44);
      base = curvePoint(c, t);
      baseX = base.x;
      baseY = base.y;

      // Past the water's edge the bank curve has nothing left to say, so a
      // wading reed is planted straight onto the surface instead.
      var wade = lakeRandom(key + i + 199) * 9;
      if (wade > 4) {
        baseX = c.x3 + toWater * (wade - 4);
        baseY = c.y3;
      }

      height = 19 + lakeRandom(key + i + 83) * 21;
      lean = (lakeRandom(key + i + 149) - 0.5) * 11;
      var tipX = baseX + lean;
      var tipY = baseY - height;
      stems.push('M' + round1(baseX) + ',' + round1(baseY) +
        'Q' + round1(baseX + lean * 0.28) + ',' + round1(baseY - height * 0.55) +
        ' ' + round1(tipX) + ',' + round1(tipY));
      heads.push('M' + round1(tipX - lean * 0.14) + ',' + round1(tipY + height * 0.17) +
        'L' + round1(tipX) + ',' + round1(tipY));
    }
  }

  // A run of points as an SVG polyline body, with no leading move command.
  function lineThrough(points) {
    var d = '';
    for (var i = 0; i < points.length; i++) {
      d += 'L' + round1(points[i].x) + ',' + round1(points[i].y);
    }
    return d;
  }

  // Grit: specks and pebbles scattered through the earth and clipped to it.
  // Drawn from the fixed noise pool, so they stay put across re-renders.
  function soilGrit(left, right, top, bottom) {
    var area = Math.max(0, (right - left) * (bottom - top));
    var count = Math.min(700, Math.round(area / 950));
    var speck = [], stone = [], i, x, y, size;

    for (i = 0; i < count; i++) {
      x = left + lakeRandom(i * 3) * (right - left);
      y = top + lakeRandom(i * 3 + 1) * (bottom - top);
      size = lakeRandom(i * 3 + 2);
      if (size > 0.87) {
        stone.push('M' + round1(x) + ',' + round1(y) +
                   'L' + round1(x + 1.6 + size * 2.4) + ',' + round1(y + 0.5));
      } else {
        speck.push('M' + round1(x) + ',' + round1(y) +
                   'L' + round1(x + 0.5) + ',' + round1(y));
      }
    }
    return { speck: speck.join(''), stone: stone.join('') };
  }

  function renderLake() {
    var g = lakeGeometry();
    if (!lake || !g) return;

    // One outline for all the earth: in from the left edge, down the bank,
    // across the bed, up the far bank and out to the right edge.
    var ground =
      'M0,' + g.sh + 'L0,' + round1(g.crestY) + 'L' + round1(g.crestL) + ',' + round1(g.crestY) +
      curveDown(g.left) + lineThrough(g.floor) +
      'L' + round1(g.waterR) + ',' + round1(g.waterY) + curveUp(g.right) +
      'L' + g.sw + ',' + round1(g.crestY) + 'L' + g.sw + ',' + g.sh + 'Z';
    lakeGround.setAttribute('d', ground);
    lakeGroundClip.setAttribute('d', ground);

    // The water is that same bed, closed off along the surface.
    lakeWater.setAttribute('d',
      'M' + round1(g.waterL) + ',' + round1(g.waterY) + lineThrough(g.floor) +
      'L' + round1(g.waterR) + ',' + round1(g.waterY) + 'Z');

    lakeSurface.setAttribute('d',
      'M' + round1(g.waterL) + ',' + round1(g.waterY) +
      'L' + round1(g.waterR) + ',' + round1(g.waterY));

    lakeShore.setAttribute('d',
      flatBand(0, g.crestL, g.crestY) + shoreBand(g.left) +
      shoreBand(g.right) + flatBand(g.crestR, g.sw, g.crestY));

    var grit = soilGrit(0, g.sw, g.crestY, g.sh);
    lakeGrit.setAttribute('d', grit.speck);
    lakeStones.setAttribute('d', grit.stone);

    var grass = [], stems = [], heads = [];
    plantFlat(0, g.crestL, g.crestY, 40, grass);
    plantBank(g.left, g.bank, 0, grass, stems, heads);
    plantBank(g.right, g.bank, 128, grass, stems, heads);
    plantFlat(g.crestR, g.sw, g.crestY, 200, grass);
    lakeGrass.setAttribute('d', grass.join(''));
    lakeReedStems.setAttribute('d', stems.join(''));
    lakeReedHeads.setAttribute('d', heads.join(''));

    lake.setAttribute('viewBox', '0 0 ' + g.sw + ' ' + g.sh);
  }

  /* ------------------------------------------------------------- fitting */

  function fits(i, cw, ch) {
    if (cw + 0.5 < cellWidth) return false;
    if (!preparedTexts[i]) {
      preparedTexts[i] = prepareWithSegments(TEXTS[i], pretextFont, pretextOptions);
    }
    return layoutText(preparedTexts[i], cw, lineHeight).height <= ch + 0.5;
  }

  // Walk longest-to-shortest instead of assuming that differently worded
  // entries fit monotonically. Pretext does the actual multiline layout; the
  // cheap cell-capacity check skips entries that are mathematically too long.
  function findBestFit(cw, ch) {
    if (!TEXTS.length || cellWidth <= 0 || lineHeight <= 0) return -1;

    var columns = Math.floor((cw + 0.5) / cellWidth);
    var rows = Math.floor((ch + 0.5) / lineHeight);
    var capacity = columns * rows;

    for (var i = TEXTS.length - 1; i >= 0; i--) {
      if (NORMALIZED_LENGTHS[i] <= capacity && fits(i, cw, ch)) return i;
    }
    return -1;
  }

  function clipPolygonAtY(points, boundary, keepGreater) {
    if (!points.length) return [];
    var clipped = [];
    var previous = points[points.length - 1];
    var previousInside = keepGreater ? previous.y >= boundary : previous.y <= boundary;

    for (var i = 0; i < points.length; i++) {
      var current = points[i];
      var currentInside = keepGreater ? current.y >= boundary : current.y <= boundary;
      if (currentInside !== previousInside) {
        var t = (boundary - previous.y) / (current.y - previous.y);
        clipped.push({
          x: previous.x + (current.x - previous.x) * t,
          y: boundary
        });
      }
      if (currentInside) clipped.push(current);
      previous = current;
      previousInside = currentInside;
    }
    return clipped;
  }

  function collisionHullsInPixels(apple, offsetX, offsetY) {
    var hulls = [];
    for (var h = 0; h < apple.collisionHulls.length; h++) {
      var points = [];
      for (var i = 0; i < apple.collisionHulls[h].length; i++) {
        var worldPoint = apple.body.getWorldPoint(apple.collisionHulls[h][i]);
        points.push({
          x: worldPoint.x * PIXELS_PER_METER - (offsetX || 0),
          y: worldPoint.y * PIXELS_PER_METER - (offsetY || 0)
        });
      }
      hulls.push(points);
    }
    return hulls;
  }

  // Move every vertex exactly `distance` pixels along the average of its two
  // outward edge normals. The hull is convex, so the expanded result remains a
  // stable convex polygon and follows body rotation without an axis-aligned box.
  function offsetHullAlongVertexNormals(points, distance) {
    if (points.length < 3 || distance === 0) return points.slice();
    var twiceArea = 0;
    for (var i = 0; i < points.length; i++) {
      var point = points[i];
      var next = points[(i + 1) % points.length];
      twiceArea += point.x * next.y - next.x * point.y;
    }
    var winding = twiceArea >= 0 ? 1 : -1;

    function edgeNormal(a, b) {
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var edgeLength = Math.sqrt(dx * dx + dy * dy) || 1;
      return {
        x: winding * dy / edgeLength,
        y: winding * -dx / edgeLength
      };
    }

    var expanded = [];
    for (i = 0; i < points.length; i++) {
      var previous = points[(i - 1 + points.length) % points.length];
      point = points[i];
      next = points[(i + 1) % points.length];
      var incomingNormal = edgeNormal(previous, point);
      var outgoingNormal = edgeNormal(point, next);
      var normalX = incomingNormal.x + outgoingNormal.x;
      var normalY = incomingNormal.y + outgoingNormal.y;
      var normalLength = Math.sqrt(normalX * normalX + normalY * normalY) || 1;
      expanded.push({
        x: point.x + normalX / normalLength * distance,
        y: point.y + normalY / normalLength * distance
      });
    }
    return expanded;
  }

  function polygonIntervalForBand(polygon, top, bottom) {
    var clipped = clipPolygonAtY(polygon.points, top, true);
    clipped = clipPolygonAtY(clipped, bottom, false);
    if (!clipped.length) return null;

    var left = Infinity;
    var right = -Infinity;
    for (var i = 0; i < clipped.length; i++) {
      left = Math.min(left, clipped[i].x);
      right = Math.max(right, clipped[i].x);
    }
    return { left: left, right: right };
  }

  // Turn every text line into one or more horizontal slots by carving the
  // falling apples out of it. A line can therefore continue on both sides of
  // an apple instead of treating the whole row as unavailable.
  function buildFlowBands(cw, ch, obstacles) {
    var bands = [];
    var rows = Math.floor((ch + 0.5) / lineHeight);
    var capacity = 0;

    for (var row = 0; row < rows; row++) {
      var top = row * lineHeight;
      var bottom = top + lineHeight;
      var blocked = [];

      for (var i = 0; i < obstacles.length; i++) {
        var interval = polygonIntervalForBand(obstacles[i], top, bottom);
        if (!interval || interval.right <= 0 || interval.left >= cw) continue;
        blocked.push({
          left: clamp(interval.left, 0, cw),
          right: clamp(interval.right, 0, cw)
        });
      }

      blocked.sort(function (a, b) { return a.left - b.left; });
      var merged = [];
      for (var j = 0; j < blocked.length; j++) {
        var last = merged[merged.length - 1];
        if (last && blocked[j].left <= last.right) {
          last.right = Math.max(last.right, blocked[j].right);
        } else {
          merged.push({ left: blocked[j].left, right: blocked[j].right });
        }
      }

      var slots = [];
      var left = 0;
      for (var k = 0; k < merged.length; k++) {
        if (merged[k].left - left + 0.5 >= cellWidth) {
          slots.push({ left: left, width: merged[k].left - left });
        }
        left = Math.max(left, merged[k].right);
      }
      if (cw - left + 0.5 >= cellWidth) {
        slots.push({ left: left, width: cw - left });
      }

      for (var s = 0; s < slots.length; s++) {
        capacity += Math.floor((slots[s].width + 0.5) / cellWidth);
      }
      bands.push({ top: top, slots: slots });
    }

    return { bands: bands, capacity: capacity };
  }

  function layoutInBands(prepared, bands, fallbackWidth, collectLines) {
    var cursor = { segmentIndex: 0, graphemeIndex: 0 };
    var lines = collectLines ? [] : null;

    for (var row = 0; row < bands.length; row++) {
      var slots = bands[row].slots;
      for (var s = 0; s < slots.length; s++) {
        var line = layoutNextLine(prepared, cursor, slots[s].width);
        if (line === null) return { complete: true, lines: lines || [] };
        if (lines) {
          lines.push({
            left: slots[s].left,
            top: bands[row].top,
            width: slots[s].width,
            text: line.text
          });
        }
        cursor = line.end;
      }
    }

    return {
      complete: layoutNextLine(prepared, cursor, fallbackWidth) === null,
      lines: lines || []
    };
  }

  function findBestFlow(cw, flow) {
    for (var i = TEXTS.length - 1; i >= 0; i--) {
      if (NORMALIZED_LENGTHS[i] > flow.capacity) continue;
      if (!preparedTexts[i]) {
        preparedTexts[i] = prepareWithSegments(TEXTS[i], pretextFont, pretextOptions);
      }
      var result = layoutInBands(preparedTexts[i], flow.bands, cw, true);
      if (result.complete) return { index: i, lines: result.lines };
    }
    return { index: -1, lines: [] };
  }

  function syncFlowLines(lines, text) {
    if (!content.classList.contains('is-flowing')) {
      content.textContent = '';
      content.classList.add('is-flowing');
      flowLineEls = [];
    }

    while (flowLineEls.length < lines.length) {
      var el = document.createElement('span');
      el.className = 'text-line';
      content.appendChild(el);
      flowLineEls.push(el);
    }

    for (var i = 0; i < flowLineEls.length; i++) {
      var lineEl = flowLineEls[i];
      var line = lines[i];
      if (!line) {
        lineEl.style.display = 'none';
        continue;
      }
      lineEl.style.display = 'block';
      lineEl.style.left = line.left + 'px';
      lineEl.style.top = line.top + 'px';
      lineEl.style.width = line.width + 'px';
      lineEl.className = 'text-line' + (i < lines.length - 1 ? ' is-justified' : '');
      if (lineEl.textContent !== line.text) lineEl.textContent = line.text;
    }

    content.setAttribute('aria-label', text);
  }

  function showResult(index, lines) {
    var key = index >= 0 ? KEYS[index] : 0;
    var text = index >= 0 ? TEXTS[index] : '';

    if (lines) {
      syncFlowLines(lines, text);
    } else {
      if (content.classList.contains('is-flowing')) {
        content.classList.remove('is-flowing');
        content.textContent = '';
        flowLineEls = [];
      }
      content.removeAttribute('aria-label');
      if (content.textContent !== text) content.textContent = text;
    }

    if (countEl.textContent !== String(key)) countEl.textContent = key;
    announce(key);
  }

  // The basin's two rising corners, as obstacles in the text's own
  // coordinates. Splitting them at the centre line is what leaves the middle
  // of each low line free: one polygon spanning the whole floor would report a
  // single interval and blank the row entirely.
  function basinObstacles(cw, ch) {
    var rise = basinRise(box.clientWidth, box.clientHeight - content.offsetTop);
    var floorBottom = ch + (padY - content.offsetTop);   // box bottom, in text space
    if (rise <= floorBottom - ch) return [];             // the bowl stays clear of the text

    var steps = 16;
    var half = cw / 2;
    var sides = [];

    for (var side = 0; side < 2; side++) {
      var points = [];
      for (var i = 0; i <= steps; i++) {
        var t = i / steps;
        var x = side === 0 ? half * t : half + half * t;
        points.push({
          x: x,
          y: floorBottom - basinLift(x + padX / 2, box.clientWidth, rise)
        });
      }
      points.push({ x: side === 0 ? half : cw, y: floorBottom + rise + 8 });
      points.push({ x: side === 0 ? 0 : half, y: floorBottom + rise + 8 });
      sides.push({ points: points, padding: 3 });
    }
    return sides;
  }

  function render() {
    var cw = box.clientWidth - padX;
    var ch = box.clientHeight - padY;
    var obstacles = basinObstacles(cw, ch).concat(getAppleObstacles());

    if (cw <= 0 || ch <= 0) {
      showResult(-1, obstacles.length ? [] : null);
      return;
    }

    if (obstacles.length) {
      var result = findBestFlow(cw, buildFlowBands(cw, ch, obstacles));
      showResult(result.index, result.lines);
    } else {
      showResult(findBestFit(cw, ch), null);
    }
  }

  // Announce only once the resize settles, so a drag is not read out frame
  // by frame.
  var announceTimer, announced = null;
  function announce(key) {
    if (key === announced) return;
    clearTimeout(announceTimer);
    announceTimer = setTimeout(function () {
      announced = key;
      statusEl.textContent = key
        ? 'Gravity explained in ' + key + ' characters'
        : 'Box too small to show any text';
    }, 400);
  }

  // The box's own size change is the single trigger for re-fitting, so drags,
  // keyboard nudges and window clamps all funnel through one path.
  var renderQueued = 0;
  function queueRender() {
    if (renderQueued) return;
    renderQueued = requestAnimationFrame(function () {
      renderQueued = 0;
      render();
    });
  }

  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(queueRender).observe(box);
    new ResizeObserver(function () { layoutLake(); queueRender(); }).observe(stage);
  }

  /* --------------------------------------------------------------- apples */

  function getAppleObstacles() {
    if (!apples.length) return [];

    var rect = content.getBoundingClientRect();
    var obstacles = [];
    for (var i = 0; i < apples.length; i++) {
      var apple = apples[i];
      var hulls = collisionHullsInPixels(apple, rect.left, rect.top);
      for (var h = 0; h < hulls.length; h++) {
        var points = offsetHullAlongVertexNormals(hulls[h], TEXT_HULL_OFFSET);
        var minX = Infinity, minY = Infinity;
        var maxX = -Infinity, maxY = -Infinity;
        for (var j = 0; j < points.length; j++) {
          var point = points[j];
          minX = Math.min(minX, point.x);
          maxX = Math.max(maxX, point.x);
          minY = Math.min(minY, point.y);
          maxY = Math.max(maxY, point.y);
        }

        if (maxX <= 0 || minX >= rect.width || maxY <= 0 || minY >= rect.height) continue;
        obstacles.push({ points: points });
      }
    }
    return obstacles;
  }

  function positionApple(apple) {
    apple.el.style.transform =
      'translate3d(' + Math.round(apple.x - apple.visualWidth / 2) + 'px,' +
      Math.round(apple.y - apple.visualHeight / 2) + 'px,0) rotate(' +
      apple.angle.toFixed(1) + 'deg)';
  }

  // ------------------------------------------------------------ splash art
  // A splash is a flipbook drawn on a 17x8 character grid: bottom row is the
  // water line, centre column is the point of impact. No glyph is ever moved --
  // a droplet appears to fly because the next frame draws it one cell further
  // out. Frames are written bottom up and stored without their empty top rows;
  // splashFrame pads them back so every frame is the same height.
  var SPLASH_ROWS = 8;            // .ascii-splash anchors on this row count
  var SPLASH_COLS = 17;
  var SPLASH_CROWN_MS = 52;       // a hair over three display frames each
  var SPLASH_PLOP_MS = 72;        // slower water: a soft entry lingers on each
  var SPLASH_CROWN_SPEED = 2.2;   // m/s; below this an apple only plops
  var SPLASH_DEPTH = ' ~-.,:vo';  // weakest to strongest; anything else is structure

  function splashFrame(rows) {
    var frame = [];
    for (var i = SPLASH_ROWS - rows.length; i > 0; i--) frame.push('');
    return frame.concat(rows);
  }

  // Fast entry: the surface punctures, a crown climbs and throws off droplets,
  // the jet collapses, and the droplets arc back down into spreading rings.
  var SPLASH_CROWN = [
    ['~~~~~~~-v-~~~~~~~'],
    ['       .:.',
     '~~~~~~~\\_/~~~~~~~'],
    ['        .',
     '     \\  |  /',
     '~~~~~~\\_|_/~~~~~~'],
    ['        .',
     '        \'',
     '    o   |   o',
     '    \\   |   /',
     '~~~~~\\__|__/~~~~~'],
    ['        .',
     '        \'',
     '  o  .  |  .  o',
     '        |',
     '   \\    |    /',
     '    \\   |   /',
     '~~~~~\\__|__/~~~~~'],
    [' o  .       .  o',
     '',
     '        .',
     '',
     '',
     '     \\  \'  /',
     '~~~-~~\\___/~~-~~~'],
    ['o   .       .   o',
     '',
     '',
     '        .',
     '       ._.',
     '~~~~-~~~~~~~-~~~~'],
    ['o   .       .   o',
     '',
     '',
     '~~~-~~~~v~~~~-~~~'],
    ['    .       .',
     'v~-~~~~~~~~~~~-~v'],
    ['~-~~v~~~~~~~v~~-~'],
    ['-~~~-~~~~~~~-~~~-'],
    ['~~-~~       ~~-~~'],
    ['~-~         ~-~'],
    ['-               -']
  ].map(splashFrame);

  // Slow entry: a stub of a crown, two droplets, and the rings.
  var SPLASH_PLOP = [
    ['~~~~~~~~v~~~~~~~~'],
    ['       . .',
     '~~~~~~~\\_/~~~~~~~'],
    ['     .     .',
     '      \\ | /',
     '~~~~~~~\\_/~~~~~~~'],
    ['    o       o',
     '',
     '',
     '       ._.',
     '~~~~~-~~~~~-~~~~~'],
    ['   .         .',
     '',
     '~~~-~~~~~~~~~-~~~'],
    ['~-~v~~~~~~~~~v~-~'],
    ['-~~~~~~~~~~~~~~~-'],
    ['~~~~~       ~~~~~'],
    ['~~             ~~']
  ].map(splashFrame);

  // Splashes are never separate elements. Two apples landing close together
  // would draw two grids over each other, glyph on glyph, with no way to blend
  // them -- so every live splash is composited onto one shared grid instead,
  // and the whole layer is a single <pre> however many are in flight.
  var splashLayer = null;
  var splashCell = 0;
  var splashGrid = [];
  var splashGridCols = 0;
  var liveSplashes = [];
  var splashFrameId = 0;

  function ensureSplashLayer() {
    if (splashLayer) return;
    splashLayer = document.createElement('pre');
    splashLayer.className = 'ascii-splash';
    splashLayer.setAttribute('aria-hidden', 'true');
    document.body.appendChild(splashLayer);

    // One measured cell is what maps an impact's x onto a grid column.
    var cs = getComputedStyle(splashLayer);
    var letterSpacing = parseFloat(cs.letterSpacing);
    if (!isFinite(letterSpacing)) letterSpacing = 0;
    var cell = prepareWithSegments('0', canvasFont(cs), { letterSpacing: letterSpacing });
    splashCell = measureNaturalWidth(cell) || parseFloat(cs.fontSize) * 0.6;
  }

  // The buffer is kept between frames and refilled, rather than reallocated
  // sixty times a second for as long as any ripple is still running.
  function clearSplashGrid(cols) {
    if (cols !== splashGridCols) {
      splashGrid = [];
      for (var r = 0; r < SPLASH_ROWS; r++) splashGrid.push(new Array(cols));
      splashGridCols = cols;
    }
    for (var row = 0; row < SPLASH_ROWS; row++) {
      var cells = splashGrid[row];
      for (var c = 0; c < cols; c++) cells[c] = ' ';
    }
    return splashGrid;
  }

  // Two splashes cannot be blended, so a contested cell goes to the heavier
  // mark: still water loses to a ripple, a ripple loses to a droplet, and the
  // standing wall of a crown beats whatever passes behind it. Equal weights go
  // to the newer splash, since that one is composited last.
  function splashWeight(mark) {
    var rank = SPLASH_DEPTH.indexOf(mark);
    return rank < 0 ? SPLASH_DEPTH.length : rank;
  }

  function composeSplash(grid, splash, cols) {
    var frame = splash.frames[splash.index];
    for (var row = 0; row < SPLASH_ROWS; row++) {
      var art = frame[row];
      var cells = grid[row];
      for (var i = 0; i < art.length; i++) {
        var mark = art.charAt(i);
        var col = splash.col + i;
        if (mark === ' ' || col < 0 || col >= cols) continue;
        if (splashWeight(mark) < splashWeight(cells[col])) continue;
        cells[col] = mark;
      }
    }
  }

  function splashAt(x, speed) {
    ensureSplashLayer();
    var heavy = speed >= SPLASH_CROWN_SPEED;
    liveSplashes.push({
      frames: heavy ? SPLASH_CROWN : SPLASH_PLOP,
      step: heavy ? SPLASH_CROWN_MS : SPLASH_PLOP_MS,
      col: Math.round(x / splashCell - 0.5) - (SPLASH_COLS - 1) / 2,
      index: 0,
      start: null   // set on the first tick that actually draws it
    });
    if (!splashFrameId) splashFrameId = requestAnimationFrame(animateSplashes);
  }

  // One ticker drives every splash on screen; it runs independently of the
  // apple loop so a ripple still plays out after the apples have gone to sleep.
  function animateSplashes(now) {
    var cols = Math.max(SPLASH_COLS, Math.ceil(window.innerWidth / splashCell));

    for (var i = liveSplashes.length - 1; i >= 0; i--) {
      var splash = liveSplashes[i];
      if (splash.start === null) splash.start = now;
      splash.index = Math.floor((now - splash.start) / splash.step);
      if (splash.index >= splash.frames.length) liveSplashes.splice(i, 1);
    }

    if (!liveSplashes.length) {
      splashLayer.textContent = '';
      splashFrameId = 0;
      return;
    }

    // Oldest first, so a newer splash wins any cell the two of them share.
    var grid = clearSplashGrid(cols);
    for (i = 0; i < liveSplashes.length; i++) composeSplash(grid, liveSplashes[i], cols);

    var rows = [];
    for (i = 0; i < SPLASH_ROWS; i++) rows.push(grid[i].join('').replace(/\s+$/, ''));

    // The layer rides the live water line, so ripples stay on the surface even
    // if the vessel is resized while they are still spreading.
    splashLayer.style.top = Math.round(content.getBoundingClientRect().top) + 'px';
    splashLayer.textContent = rows.join('\n');
    splashFrameId = requestAnimationFrame(animateSplashes);
  }

  var appleFrame = 0;
  var lastAppleTime = 0;
  var physicsAccumulator = 0;

  function ensureAppleFrame() {
    if (appleFrame) return;
    lastAppleTime = 0;
    physicsAccumulator = 0;
    appleFrame = requestAnimationFrame(animateApples);
  }

  function endAppleDrag(pointerId) {
    var drag = activeDrags[pointerId];
    if (!drag) return;
    physicsWorld.destroyJoint(drag.joint);
    delete activeDrags[pointerId];
    drag.apple.dragPointer = null;
    drag.apple.el.classList.remove('is-dragging');
    drag.apple.body.setSleepingAllowed(true);
    drag.apple.body.setAwake(true);
  }

  function makeAppleDraggable(apple) {
    apple.el.addEventListener('pointerdown', function (e) {
      if ((e.pointerType === 'mouse' && e.button !== 0) || apple.dragPointer != null) return;
      e.preventDefault();
      e.stopPropagation();

      var pointer = Physics.Vec2(e.clientX / PIXELS_PER_METER, e.clientY / PIXELS_PER_METER);
      var center = apple.body.getWorldCenter();
      var joint = new Physics.MouseJoint({
        maxForce: apple.body.getMass() * 300,
        frequencyHz: 7,
        dampingRatio: 0.88
      }, dragAnchorBody, apple.body, center);
      physicsWorld.createJoint(joint);
      activeDrags[e.pointerId] = {
        apple: apple,
        joint: joint,
        offsetX: center.x - pointer.x,
        offsetY: center.y - pointer.y
      };
      apple.dragPointer = e.pointerId;
      apple.el.classList.add('is-dragging');
      apple.body.setSleepingAllowed(false);
      apple.body.setAngularVelocity(0);
      apple.body.setAwake(true);
      ensureAppleFrame();
      try { apple.el.setPointerCapture(e.pointerId); } catch (err) {}
    });

    apple.el.addEventListener('pointermove', function (e) {
      var drag = activeDrags[e.pointerId];
      if (!drag || drag.apple !== apple) return;
      e.preventDefault();
      drag.joint.setTarget(Physics.Vec2(
        e.clientX / PIXELS_PER_METER + drag.offsetX,
        e.clientY / PIXELS_PER_METER + drag.offsetY
      ));
      apple.body.setAwake(true);
      ensureAppleFrame();
    });

    function finish(e) {
      if (!activeDrags[e.pointerId]) return;
      e.preventDefault();
      endAppleDrag(e.pointerId);
      try { apple.el.releasePointerCapture(e.pointerId); } catch (err) {}
    }

    apple.el.addEventListener('pointerup', finish);
    apple.el.addEventListener('pointercancel', finish);
    apple.el.addEventListener('lostpointercapture', finish);
  }

  function removeApple(apple, index) {
    if (apple.dragPointer != null) endAppleDrag(apple.dragPointer);
    physicsWorld.destroyBody(apple.body);
    apple.el.remove();
    apples.splice(index, 1);
  }

  function drawPhysicsDebug() {
    if (!physicsDebugEnabled || !physicsDebugCanvas) return;

    var width = window.innerWidth;
    var height = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var pixelWidth = Math.round(width * dpr);
    var pixelHeight = Math.round(height * dpr);
    if (physicsDebugCanvas.width !== pixelWidth || physicsDebugCanvas.height !== pixelHeight) {
      physicsDebugCanvas.width = pixelWidth;
      physicsDebugCanvas.height = pixelHeight;
    }

    var ctx = physicsDebugCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Static Planck boxes: the two walls and floor of the open vessel.
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.25;
    ctx.strokeStyle = 'rgba(14, 165, 233, .9)';
    ctx.fillStyle = 'rgba(14, 165, 233, .07)';
    for (var i = 0; i < vesselDebugShapes.length; i++) {
      var shape = vesselDebugShapes[i];
      ctx.beginPath();
      for (var v = 0; v < shape.length; v++) {
        if (v === 0) ctx.moveTo(shape[v].x, shape[v].y);
        else ctx.lineTo(shape[v].x, shape[v].y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    for (i = 0; i < apples.length; i++) {
      var apple = apples[i];
      var isStone = apple.el.classList.contains('stone');
      var isGreen = apple.el.classList.contains('green-apple');
      var isDuck = apple.el.classList.contains('duck');
      var isFish = apple.el.classList.contains('fish');
      var color = isFish ? '37, 99, 235' : (isDuck ? '8, 145, 178' :
        (isStone ? '161, 98, 7' :
        (isGreen ? '22, 163, 74' : '225, 29, 72')));

      // The dotted rectangle is the alpha-measured SVG box; the solid polygon
      // is the actual collision fixture, transformed by the Planck body.
      ctx.save();
      ctx.translate(apple.x, apple.y);
      ctx.rotate(apple.body.getAngle());
      ctx.setLineDash([2, 3]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(' + color + ', .45)';
      ctx.strokeRect(-apple.visualWidth / 2, -apple.visualHeight / 2,
        apple.visualWidth, apple.visualHeight);
      ctx.restore();

      var collisionHulls = collisionHullsInPixels(apple, 0, 0);
      for (var h = 0; h < collisionHulls.length; h++) {
        var collisionPoints = collisionHulls[h];
        ctx.beginPath();
        for (var j = 0; j < collisionPoints.length; j++) {
          if (j === 0) ctx.moveTo(collisionPoints[j].x, collisionPoints[j].y);
          else ctx.lineTo(collisionPoints[j].x, collisionPoints[j].y);
        }
        ctx.closePath();
        ctx.setLineDash([]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(' + color + ', .95)';
        ctx.fillStyle = 'rgba(' + color + ', .11)';
        ctx.fill();
        ctx.stroke();

        var textHull = offsetHullAlongVertexNormals(collisionPoints, TEXT_HULL_OFFSET);
        ctx.beginPath();
        for (j = 0; j < textHull.length; j++) {
          if (j === 0) ctx.moveTo(textHull[j].x, textHull[j].y);
          else ctx.lineTo(textHull[j].x, textHull[j].y);
        }
        ctx.closePath();
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 1.25;
        ctx.strokeStyle = 'rgba(168, 85, 247, .95)';
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(168, 85, 247, .95)';
        for (j = 0; j < textHull.length; j++) {
          ctx.beginPath();
          ctx.arc(textHull[j].x, textHull[j].y, 1.75, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      var center = apple.body.getWorldCenter();
      var centerX = center.x * PIXELS_PER_METER;
      var centerY = center.y * PIXELS_PER_METER;
      ctx.beginPath();
      ctx.moveTo(centerX - 4, centerY);
      ctx.lineTo(centerX + 4, centerY);
      ctx.moveTo(centerX, centerY - 4);
      ctx.lineTo(centerX, centerY + 4);
      ctx.strokeStyle = 'rgba(' + color + ', .95)';
      ctx.stroke();
    }

    ctx.setLineDash([]);
    ctx.font = '11px ui-monospace, SFMono-Regular, Consolas, monospace';
    ctx.fillStyle = window.matchMedia('(prefers-color-scheme: dark)').matches
      ? 'rgba(226, 232, 240, .82)'
      : 'rgba(30, 41, 59, .78)';
    ctx.fillText('PHYSICS  |  solid: collider  |  violet: text hull +4 px  |  Esc: hide', 12, 20);
  }

  function initPhysicsDebug() {
    if (!physicsDebugAllowed) return;
    physicsDebugCanvas = document.createElement('canvas');
    physicsDebugCanvas.className = 'physics-debug-overlay';
    physicsDebugCanvas.setAttribute('aria-hidden', 'true');
    physicsDebugCanvas.hidden = true;
    document.body.appendChild(physicsDebugCanvas);

    window.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape' || e.repeat) return;
      e.preventDefault();
      physicsDebugEnabled = !physicsDebugEnabled;
      physicsDebugCanvas.hidden = !physicsDebugEnabled;
      if (physicsDebugEnabled) drawPhysicsDebug();
    });
  }

  // The ground is one static body carrying a quad per segment of the terrain
  // line. Each quad is that segment extruded along its inward normal, so the
  // surface objects rest on is exactly the surface that was drawn -- sloping
  // banks included, where a stone dropped on the shore rolls down into the
  // water instead of stopping against an invisible wall.
  function addTerrainBody(points) {
    var body = physicsWorld.createBody({ type: 'static', position: Physics.Vec2(0, 0) });
    var built = 0;

    for (var i = 0; i < points.length - 1; i++) {
      var a = points[i], b = points[i + 1];
      var dx = b.x - a.x, dy = b.y - a.y;
      var length = Math.sqrt(dx * dx + dy * dy);
      if (length < 0.5) continue;          // a flat quad would fail the hull

      // Walking the line left to right, the ground lies to this side of it.
      var nx = -dy / length * WALL_THICKNESS;
      var ny = dx / length * WALL_THICKNESS;

      body.createFixture(new Physics.Polygon([
        Physics.Vec2(a.x / PIXELS_PER_METER, a.y / PIXELS_PER_METER),
        Physics.Vec2(b.x / PIXELS_PER_METER, b.y / PIXELS_PER_METER),
        Physics.Vec2((b.x + nx) / PIXELS_PER_METER, (b.y + ny) / PIXELS_PER_METER),
        Physics.Vec2((a.x + nx) / PIXELS_PER_METER, (a.y + ny) / PIXELS_PER_METER)
      ]), { friction: 0.42, restitution: 0.04 });

      vesselDebugShapes.push([
        { x: a.x, y: a.y }, { x: b.x, y: b.y },
        { x: b.x + nx, y: b.y + ny }, { x: a.x + nx, y: a.y + ny }
      ]);
      built++;
    }

    if (built) vesselBodies.push(body);
    else physicsWorld.destroyBody(body);
  }

  function syncVesselBodies() {
    for (var i = 0; i < vesselBodies.length; i++) {
      physicsWorld.destroyBody(vesselBodies[i]);
    }
    vesselBodies = [];
    vesselDebugShapes = [];

    var g = lakeGeometry();
    if (!g) {
      drawPhysicsDebug();
      return;
    }

    addTerrainBody(terrainPoints(g));
    drawPhysicsDebug();
  }

  function wakeApples() {
    if (!apples.length) {
      drawPhysicsDebug();
      return;
    }
    for (var i = 0; i < apples.length; i++) apples[i].body.setAwake(true);
    ensureAppleFrame();
  }

  function applyWaterForces(water, vessel) {
    for (var i = 0; i < apples.length; i++) {
      var apple = apples[i];
      var body = apple.body;
      if (!body.isAwake()) continue;

      var position = body.getPosition();
      var volumeCenter = apple.buoyancyVolumeCenter
        ? body.getWorldPoint(apple.buoyancyVolumeCenter)
        : position;
      var x = volumeCenter.x * PIXELS_PER_METER;
      var y = position.y * PIXELS_PER_METER;
      var overWater = x > vessel.left && x < vessel.right;
      var submergedDepth = overWater
        ? clamp(
            volumeCenter.y + apple.radiusMeters - water.top / PIXELS_PER_METER,
            0,
            apple.radiusMeters * 2
          )
        : 0;
      // Exact volume fraction of a submerged spherical cap.
      var submerged = Math.pow(submergedDepth, 2) *
        (3 * apple.radiusMeters - submergedDepth) /
        (4 * Math.pow(apple.radiusMeters, 3));

      if (submerged > 0 && y - apple.visualRadius < vessel.bottom) {
        body.setLinearDamping(AIR_LINEAR_DAMPING + WATER_LINEAR_DAMPING * submerged);
        body.setAngularDamping(AIR_ANGULAR_DAMPING + WATER_ANGULAR_DAMPING * submerged);
        var velocity = body.getLinearVelocity();
        // The water is stationary, so body velocity is also velocity relative
        // to the fluid. Use the actually submerged projected area for drag.
        var relativeX = velocity.x;
        var relativeY = velocity.y;
        var speed = Math.sqrt(relativeX * relativeX + relativeY * relativeY);
        var wetArea = submergedProjectedArea(apple.radiusMeters, submergedDepth);
        var buoyancyForce = WATER_DENSITY * EARTH_GRAVITY *
          apple.volumeM3 * submerged;
        var dragForce = speed > 0
          ? 6 * Math.PI * WATER_DYNAMIC_VISCOSITY * apple.radiusMeters *
              speed * submerged +
            0.5 * WATER_DENSITY * apple.dragCoefficient *
              wetArea * speed * speed
          : 0;
        // Do not let an explicit simulation step reverse the fluid-relative
        // velocity; the remaining forces take over naturally on the next step.
        dragForce = Math.min(dragForce, body.getMass() * speed / PHYSICS_STEP);
        body.applyForceToCenter(Physics.Vec2(
          speed > 0 ? -dragForce * relativeX / speed : 0,
          speed > 0 ? -dragForce * relativeY / speed : 0
        ), false);
        var buoyancyVector = Physics.Vec2(0, -buoyancyForce);
        if (apple.buoyancyForcePoint) {
          body.applyForce(
            buoyancyVector,
            body.getWorldPoint(apple.buoyancyForcePoint),
            false
          );
        } else {
          body.applyForceToCenter(buoyancyVector, false);
        }

        var angularVelocity = body.getAngularVelocity();
        var radiusCubed = Math.pow(apple.radiusMeters, 3);
        var viscousTorque = 8 * Math.PI * WATER_DYNAMIC_VISCOSITY *
          radiusCubed * angularVelocity * submerged;
        var formTorque = 0.5 * WATER_DENSITY * apple.rotationalDragCoefficient *
          wetArea * radiusCubed * angularVelocity * Math.abs(angularVelocity);
        body.applyTorque(-viscousTorque - formTorque, false);
      } else {
        body.setLinearDamping(AIR_LINEAR_DAMPING);
        body.setAngularDamping(AIR_ANGULAR_DAMPING);
      }
    }
  }

  function checkForSplash(apple, water, vessel, now) {
    var overWater = apple.x > vessel.left && apple.x < vessel.right;
    var touchesWater = overWater &&
      apple.y + apple.collisionBottom >= water.top &&
      apple.y - apple.collisionTop < vessel.bottom;

    if (touchesWater && !apple.inWater) {
      var downwardSpeed = apple.body.getLinearVelocity().y;
      if (downwardSpeed > 0.8 && now - apple.lastSplash > 450) {
        splashAt(clamp(apple.x, vessel.left, vessel.right), downwardSpeed);
        apple.lastSplash = now;
      }
      apple.inWater = true;
    } else if (!overWater ||
        apple.y + apple.collisionBottom < water.top - 4 ||
        apple.y - apple.collisionTop > vessel.bottom) {
      apple.inWater = false;
    }
  }

  function animateApples(now) {
    var dt = lastAppleTime ? Math.min((now - lastAppleTime) / 1000, 0.05) : 0;
    lastAppleTime = now;
    var water = content.getBoundingClientRect();
    var vessel = box.getBoundingClientRect();
    physicsAccumulator = Math.min(physicsAccumulator + dt, 0.1);

    while (physicsAccumulator >= PHYSICS_STEP) {
      applyWaterForces(water, vessel);
      physicsWorld.step(PHYSICS_STEP, 10, 6);
      physicsAccumulator -= PHYSICS_STEP;
    }

    for (var i = apples.length - 1; i >= 0; i--) {
      var apple = apples[i];
      var position = apple.body.getPosition();
      apple.x = position.x * PIXELS_PER_METER;
      apple.y = position.y * PIXELS_PER_METER;
      apple.angle = apple.body.getAngle() * 180 / Math.PI;
      checkForSplash(apple, water, vessel, now);
      positionApple(apple);

      // Spilled apples have no floor outside the vessel. Once their top has
      // crossed the viewport floor they are gone, both visually and physically.
      if (apple.y - apple.visualRadius > window.innerHeight) {
        removeApple(apple, i);
      }
    }

    // The obstacle geometry changes with every physics step, so wrapping and
    // the selected character budget are recomputed in the same animation frame.
    render();
    drawPhysicsDebug();

    if (apples.some(function (apple) {
      return apple.dragPointer != null || apple.body.isAwake();
    })) {
      appleFrame = requestAnimationFrame(animateApples);
    } else {
      appleFrame = 0;
      lastAppleTime = 0;
    }
  }

  function dropApple() {
    var rect = content.getBoundingClientRect();
    var sequenceIndex = spawnCount++;
    var isStone = sequenceIndex < 10;
    var isFish = sequenceIndex === 10;
    var isDuck = sequenceIndex === 11;
    var sizeScale = isStone
      ? STONE_MIN_SCALE + Math.random() * (STONE_MAX_SCALE - STONE_MIN_SCALE)
      : 1;
    var assetName = isFish ? 'fish' : (isDuck ? 'duck' : (isStone
      ? 'rock'
      : (Math.random() < 0.5 ? 'redApple' : 'greenApple')));
    var asset = NOTO_EMOJI[assetName];
    var physicalWidth = isFish
      ? FISH_PHYSICAL_WIDTH
      : (isDuck
      ? DUCK_PHYSICAL_WIDTH
      : APPLE_RADIUS_METERS * 2 * sizeScale);
    var sourceToScreen = physicalWidth * PIXELS_PER_METER / asset.bounds.width;
    var visualWidth = asset.bounds.width * sourceToScreen;
    var visualHeight = asset.bounds.height * sourceToScreen;
    var visualRadius = Math.max(visualWidth, visualHeight) / 2;
    var radiusMeters = isFish
      ? FISH_HYDRO_RADIUS
      : (isDuck
      ? DUCK_HYDRO_RADIUS
      : APPLE_RADIUS_METERS * sizeScale);
    var volumeM3 = isFish
      ? FISH_VOLUME_M3
      : (isDuck
      ? DUCK_VOLUME_M3
      : 4 / 3 * Math.PI * Math.pow(radiusMeters, 3));
    var massKg = isFish
      ? FISH_MASS_KG
      : (isDuck
      ? DUCK_MASS_KG
      : (isStone ? STONE_DENSITY * volumeM3 : APPLE_MASS_KG));
    var collision = makeCollisionHull(asset, physicalWidth);
    // Planck is two-dimensional, so fixture density is mass per hull area.
    var fixtureDensity = massKg / collision.area;
    var minX = rect.left + visualWidth / 2;
    var maxX = rect.right - visualWidth / 2;
    var x = maxX > minX ? minX + Math.random() * (maxX - minX) : rect.left + rect.width / 2;
    var el = document.createElement('span');
    var image = document.createElement('img');
    var y = -visualHeight / 2 - 4 - Math.random() * 18;
    var angleRange = isDuck || isFish ? 8 : 18;
    var angle = (-angleRange + Math.random() * angleRange * 2) * Math.PI / 180;
    var body = physicsWorld.createDynamicBody({
      position: Physics.Vec2(x / PIXELS_PER_METER, y / PIXELS_PER_METER),
      angle: angle,
      bullet: true,
      linearDamping: AIR_LINEAR_DAMPING,
      angularDamping: AIR_ANGULAR_DAMPING
    });
    for (var h = 0; h < collision.hulls.length; h++) {
      body.createFixture(new Physics.Polygon(collision.hulls[h]), {
        density: fixtureDensity,
        friction: isFish ? 0.16 : (isDuck ? 0.28 : 0.38),
        restitution: isFish ? 0.04 : (isDuck ? 0.06 : 0.14)
      });
    }

    var buoyancyVolumeCenter = null;
    var buoyancyForcePoint = null;
    if (isDuck) {
      // Keep the centre of mass low in the breast. Applying buoyancy above that
      // point makes a tipped duck right itself naturally at any display scale.
      var duckCenterOfMass = Physics.Vec2(
        0.055 * DUCK_SCALE,
        0.115 * DUCK_SCALE
      );
      var physicalHeight = physicalWidth * asset.bounds.height / asset.bounds.width;
      var centeredInertia = massKg *
        (physicalWidth * physicalWidth + physicalHeight * physicalHeight) / 12;
      body.setMassData({
        mass: massKg,
        center: duckCenterOfMass,
        I: centeredInertia + massKg *
          (duckCenterOfMass.x * duckCenterOfMass.x +
           duckCenterOfMass.y * duckCenterOfMass.y)
      });
      buoyancyVolumeCenter = Physics.Vec2(
        0.055 * DUCK_SCALE,
        0.110 * DUCK_SCALE
      );
      buoyancyForcePoint = Physics.Vec2(
        0.055 * DUCK_SCALE,
        0.055 * DUCK_SCALE
      );
    } else if (isFish) {
      var fishCenterOfMass = Physics.Vec2(-0.012, 0.013);
      var fishHeight = physicalWidth * asset.bounds.height / asset.bounds.width;
      var fishInertia = massKg *
        (physicalWidth * physicalWidth + fishHeight * fishHeight) / 12;
      body.setMassData({
        mass: massKg,
        center: fishCenterOfMass,
        I: fishInertia + massKg *
          (fishCenterOfMass.x * fishCenterOfMass.x +
           fishCenterOfMass.y * fishCenterOfMass.y)
      });
      buoyancyVolumeCenter = Physics.Vec2(-0.012, 0.008);
      buoyancyForcePoint = Physics.Vec2(-0.012, -0.004);
    }

    var angularSpeedRange = isDuck || isFish ? 20 : 80;
    body.setAngularVelocity(
      (-angularSpeedRange + Math.random() * angularSpeedRange * 2) * Math.PI / 180
    );
    var apple = {
      el: el,
      body: body,
      x: x,
      y: y,
      angle: angle * 180 / Math.PI,
      visualWidth: visualWidth,
      visualHeight: visualHeight,
      visualRadius: visualRadius,
      collisionTop: collision.top,
      collisionBottom: collision.bottom,
      collisionHulls: collision.hulls,
      radiusMeters: radiusMeters,
      volumeM3: volumeM3,
      buoyancyVolumeCenter: buoyancyVolumeCenter,
      buoyancyForcePoint: buoyancyForcePoint,
      dragCoefficient: isFish ? FISH_DRAG_COEFFICIENT :
        (isDuck ? DUCK_DRAG_COEFFICIENT :
        (isStone ? STONE_DRAG_COEFFICIENT : APPLE_DRAG_COEFFICIENT)),
      rotationalDragCoefficient: isFish ? FISH_ROTATIONAL_DRAG :
        (isDuck ? DUCK_ROTATIONAL_DRAG :
        (isStone ? STONE_ROTATIONAL_DRAG : APPLE_ROTATIONAL_DRAG)),
      dragPointer: null,
      inWater: false,
      lastSplash: -Infinity
    };

    el.className = 'apple ' + (isFish ? 'fish' : (isDuck ? 'duck' :
      (isStone ? 'stone' :
      (assetName === 'redApple' ? 'red-apple' : 'green-apple'))));
    el.setAttribute('aria-hidden', 'true');
    el.style.width = visualWidth + 'px';
    el.style.height = visualHeight + 'px';
    image.alt = '';
    image.draggable = false;
    image.src = asset.src;
    image.width = 128;
    image.height = 128;
    image.style.width = 128 * sourceToScreen + 'px';
    image.style.height = 128 * sourceToScreen + 'px';
    image.style.left = -asset.bounds.x * sourceToScreen + 'px';
    image.style.top = -asset.bounds.y * sourceToScreen + 'px';
    el.appendChild(image);
    document.body.appendChild(el);
    apples.push(apple);
    makeAppleDraggable(apple);
    positionApple(apple);

    ensureAppleFrame();
  }

  // Distinguish a tap/click from a resize drag so grabbing a handle does not
  // accidentally rain apples. The release can be retargeted by pointer capture,
  // hence the window-level listeners.
  var tapStarts = Object.create(null);
  window.addEventListener('pointerdown', function (e) {
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest && e.target.closest('.apple')) return;
    tapStarts[e.pointerId] = { x: e.clientX, y: e.clientY, moved: false };
  }, true);

  window.addEventListener('pointermove', function (e) {
    var tap = tapStarts[e.pointerId];
    if (!tap || tap.moved) return;
    var dx = e.clientX - tap.x;
    var dy = e.clientY - tap.y;
    if (dx * dx + dy * dy > 100) tap.moved = true;
  }, true);

  window.addEventListener('pointerup', function (e) {
    var tap = tapStarts[e.pointerId];
    delete tapStarts[e.pointerId];
    if (tap && !tap.moved) dropApple();
  }, true);

  window.addEventListener('pointercancel', function (e) {
    delete tapStarts[e.pointerId];
  }, true);

  /* ---------------------------------------------------------------- boot */

  function debounce(fn, wait) {
    var timer;
    return function () {
      clearTimeout(timer);
      timer = setTimeout(fn, wait);
    };
  }

  window.addEventListener('resize', debounce(function () {
    measure();
    layoutLake();
    queueRender();
  }, 120));

  initPhysicsDebug();
  measure();
  layoutLake();
  render();
  box.classList.add('is-ready');
  lake.classList.add('is-ready');

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measure(); render(); });
  }
})();
</script>

</body>
</html>
