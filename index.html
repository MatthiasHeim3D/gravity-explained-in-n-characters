<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gravity explained in n characters</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An LLM experiment: gravity explained at whatever length fits inside a box you resize yourself.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)">
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  color-scheme: light dark;

  --bg:          #f2f1ef;
  --bg-grid:     rgba(28, 25, 23, .045);
  --paper:       #ffffff;
  --ink:         #1b1a19;
  --muted:       #6f6b66;
  --line:        #ddd8d2;
  --handle:      #8a837b;
  --accent:      #5b5bd6;
  --accent-ring: rgba(91, 91, 214, .22);
  --water:       rgba(64, 157, 204, .085);
  --water-deep:  rgba(64, 157, 204, .14);
  --water-line:  rgba(54, 145, 194, .48);
  --glass-line:  rgba(100, 151, 174, .48);
  --shadow:      0 1px 2px rgba(28,25,23,.05), 0 10px 30px -12px rgba(28,25,23,.28);
  --shadow-lift: 0 1px 2px rgba(28,25,23,.06), 0 18px 40px -14px rgba(28,25,23,.36);

  --radius: 12px;

  /* handles: hit target and visual are deliberately decoupled */
  --corner-hit: 30px;
  --edge-hit:   18px;
  --bracket:    20px;
  --stroke:     3px;
  --pill:       36px;
  --pill-t:     4px;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:          #12110f;
    --bg-grid:     rgba(245, 240, 235, .05);
    --paper:       #1c1a18;
    --ink:         #eceae7;
    --muted:       #97918a;
    --line:        #34302c;
    --handle:      #7f7871;
    --accent:      #8f8bff;
    --accent-ring: rgba(143, 139, 255, .26);
    --water:       rgba(80, 173, 218, .09);
    --water-deep:  rgba(80, 173, 218, .15);
    --water-line:  rgba(105, 196, 235, .48);
    --glass-line:  rgba(104, 169, 196, .45);
    --shadow:      0 1px 2px rgba(0,0,0,.5), 0 10px 30px -12px rgba(0,0,0,.7);
    --shadow-lift: 0 1px 2px rgba(0,0,0,.55), 0 18px 40px -14px rgba(0,0,0,.8);
  }
}

/* touch devices get fat, forgiving targets */
@media (pointer: coarse) {
  :root {
    --corner-hit: 46px;
    --edge-hit:   30px;
    --bracket:    24px;
    --stroke:     4px;
    --pill:       40px;
    --pill-t:     5px;
  }
}

/* ---------------------------------------------------------------- layout */
* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  display: flex;
  flex-direction: column;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 44px 44px;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  padding:
    max(16px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(0px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

html.no-select, html.no-select * { user-select: none; -webkit-user-select: none; }

/* ---------------------------------------------------------------- header */
.masthead {
  position: relative;
  flex: none;
  text-align: center;
  padding-bottom: 14px;
}

.title {
  margin: 0;
  padding-inline: 36px;
  font-family: var(--mono);
  font-size: clamp(1.05rem, 3.6vw, 1.6rem);
  font-weight: 600;
  letter-spacing: -.01em;
  line-height: 1.3;
}

.github-link {
  position: absolute;
  top: -4px;
  right: 0;
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  color: var(--muted);
  transition: color .15s ease, background-color .15s ease;
}
.github-link:hover { color: var(--ink); background: var(--accent-ring); }
.github-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.github-link svg { width: 18px; height: 18px; fill: currentColor; }

#charCount {
  display: inline-block;
  min-width: 1.2em;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.hint {
  margin: 8px 0 0;
  min-height: 1.35em;
  font-size: clamp(.78rem, 2.4vw, .875rem);
  color: var(--muted);
}

/* ----------------------------------------------------------------- stage */
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

/* ------------------------------------------------------------------- box */
#box {
  --waterline-y: 16px;
  position: absolute;
  top: auto;
  bottom: 0;
  left: 0;
  width: 340px;
  height: 220px;
  padding: 16px;
  border: 0 solid var(--glass-line);
  border-right-width: 1px;
  border-bottom-width: 1px;
  border-left-width: 1px;
  border-radius: 0 0 var(--radius) var(--radius);
  background:
    linear-gradient(to bottom,
      transparent 0 var(--waterline-y),
      var(--water) var(--waterline-y),
      var(--water-deep) 100%),
    var(--paper);
  box-shadow: var(--shadow);
  opacity: 0;
  transition: opacity .35s ease, box-shadow .2s ease, border-color .2s ease;
}

#box::before {
  content: "";
  position: absolute;
  z-index: 1;
  top: var(--waterline-y);
  left: 0;
  right: 0;
  height: 1px;
  pointer-events: none;
  background: var(--water-line);
  box-shadow: 0 3px 10px rgba(64, 157, 204, .11);
}

#box.is-ready { opacity: 1; }

#box.is-resizing {
  border-color: var(--accent);
  box-shadow: var(--shadow-lift), 0 0 0 3px var(--accent-ring);
  transition: opacity .35s ease;
}

#boxContent {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.45;
  text-align: justify;
  hyphens: none;
  word-break: normal;
  overflow-wrap: break-word;
  overflow: hidden;
}

.text-line {
  position: absolute;
  display: block;
  white-space: nowrap;
  overflow: hidden;
}

.text-line.is-justified {
  text-align: justify;
  text-align-last: justify;
}

.apple {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  width: 44px;
  height: 44px;
  cursor: grab;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  font-size: 40px;
  line-height: 44px;
  text-align: center;
  filter: drop-shadow(0 4px 3px rgba(28, 25, 23, .2));
  will-change: transform;
}

.apple.is-dragging { cursor: grabbing; }

/* A splash is a flipbook of character grids, not a moving object. The
   transform only parks the grid: its centre column on the impact point, its
   last row on the water line. Everything that looks like motion is a glyph
   appearing in a different cell one frame later. */
.ascii-splash {
  --splash-row: 9px;   /* one row of the character grid */
  position: fixed;
  z-index: 9;
  margin: 0;
  pointer-events: none;
  color: var(--water-line);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  line-height: var(--splash-row);
  white-space: pre;
  text-shadow: 0 1px 5px var(--water);
  /* Lift the grid by its 8 rows, give back half a row to centre the water-line
     row on the anchor, then 1.5px more because a tilde draws above that centre. */
  transform: translate(-50%, calc(-7.5 * var(--splash-row) + 1.5px));
}

@media (pointer: coarse) {
  #box { --waterline-y: 14px; padding: 14px; }
  #boxContent { font-size: 14px; }
}

/* --------------------------------------------------------------- handles */
.handle {
  --c: var(--handle);
  position: absolute;
  z-index: 5;
  touch-action: none;          /* stop the browser scrolling the page mid-drag */
  -webkit-tap-highlight-color: transparent;
}

.handle::before {
  content: "";
  position: absolute;
  opacity: .85;
  transition: width .18s ease, height .18s ease, background-color .15s ease,
              border-color .15s ease, transform .15s ease, opacity .15s ease;
}

.handle:hover,
.handle[data-active] { --c: var(--accent); }

/* Edge handles: the whole edge is grabbable and a centred pill hints at it.
   On hover or drag the pill stretches to the full edge to prove the point. */
.handle.edge::before {
  border-radius: 999px;
  background: var(--c);
}

.handle.n {
  left: calc(var(--corner-hit) / 2);
  right: calc(var(--corner-hit) / 2);
  height: var(--edge-hit);
  cursor: ns-resize;
}
.handle.n { top: calc(var(--edge-hit) / -2); }

.handle.e, .handle.w {
  top: calc(var(--corner-hit) / 2);
  bottom: calc(var(--corner-hit) / 2);
  width: var(--edge-hit);
  cursor: ew-resize;
}
.handle.e { right: calc(var(--edge-hit) / -2); }
.handle.w { left: calc(var(--edge-hit) / -2); }

.handle.n::before {
  left: 0; right: 0; margin: 0 auto;
  top: calc(50% - var(--pill-t) / 2);
  width: var(--pill);
  height: var(--pill-t);
}
.handle.e::before, .handle.w::before {
  top: 0; bottom: 0; margin: auto 0;
  left: calc(50% - var(--pill-t) / 2);
  width: var(--pill-t);
  height: var(--pill);
}

.handle.n:hover::before, .handle.n[data-active]::before { width: 100%; }

.handle.e:hover::before, .handle.e[data-active]::before,
.handle.w:hover::before, .handle.w[data-active]::before { height: 100%; }

/* Corner handles: an L-bracket whose stroke sits centred on the box edge, so
   it reads as a thickened corner of the box rather than a floating dot. */
.handle.corner { width: var(--corner-hit); height: var(--corner-hit); }

.handle.corner::before {
  width: var(--bracket);
  height: var(--bracket);
  border: var(--stroke) solid transparent;
}

.handle.corner:hover::before,
.handle.corner[data-active]::before { transform: scale(1.18); }

.handle.nw { top: calc(var(--corner-hit) / -2); left: calc(var(--corner-hit) / -2); cursor: nwse-resize; }
.handle.ne { top: calc(var(--corner-hit) / -2); right: calc(var(--corner-hit) / -2); cursor: nesw-resize; }

.handle.nw::before {
  top: calc(50% - var(--stroke) / 2); left: calc(50% - var(--stroke) / 2);
  border-top-color: var(--c); border-left-color: var(--c);
  border-radius: var(--radius) 0 0 0;
  transform-origin: top left;
}
.handle.ne::before {
  top: calc(50% - var(--stroke) / 2); right: calc(50% - var(--stroke) / 2);
  border-top-color: var(--c); border-right-color: var(--c);
  border-radius: 0 var(--radius) 0 0;
  transform-origin: top right;
}
/* A gentle "you can grab me" pulse, only until the first interaction. */
@keyframes handle-hint {
  0%, 100% { opacity: .55; }
  50%      { opacity: 1; }
}
html:not(.has-interacted) .handle::before {
  animation: handle-hint 2.4s ease-in-out 3;
}
#box:hover .handle::before,
.handle:hover::before,
.handle[data-active]::before { opacity: 1; }

@media (pointer: coarse) {
  .handle::before { opacity: .95; }
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>

<header class="masthead">
  <h1 class="title">Gravity explained in <span id="charCount">n</span> characters</h1>
  <p class="hint" id="hint">Tap or click anywhere to drop an apple. Drag apples, or drag the vessel’s top or sides to resize.</p>
  <a class="github-link" href="https://github.com/MatthiasHeim3D/gravity-explained-in-n-characters" target="_blank" rel="noopener" aria-label="View source on GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  </a>
</header>

<main id="stage">
  <section id="box" aria-label="Resizable explanation box">
    <p id="boxContent"></p>

    <!-- Pointer-only targets, so they are decorative to assistive tech. -->
    <div class="handle edge n"    data-dir="n"  aria-hidden="true"></div>
    <div class="handle edge e"    data-dir="e"  aria-hidden="true"></div>
    <div class="handle edge w"    data-dir="w"  aria-hidden="true"></div>
    <div class="handle corner nw" data-dir="nw" aria-hidden="true"></div>
    <div class="handle corner ne" data-dir="ne" aria-hidden="true"></div>
  </section>
</main>

<p id="status" class="sr-only" role="status" aria-live="polite"></p>

<script src="lookup_table.js"></script>
<script>
// Keep the page usable if lookup_table.js is missing.
if (typeof window.lookupTable === 'undefined') {
  window.lookupTable = {
    1: "G",
    5: "Force",
    17: "Warped spacetime.",
    50: "Objects follow the straightest paths they can find.",
    140: "Gravity is not a force but geometry: mass and energy curve spacetime, and everything, light included, simply follows the curvature it finds."
  };
  console.warn('lookup_table.js not found - using a tiny placeholder table.');
}
</script>

<script src="vendor/physics.js"></script>
<script src="vendor/pretext.js"></script>
<script>
var layoutText = Pretext.layout;
var layoutNextLine = Pretext.layoutNextLine;
var measureNaturalWidth = Pretext.measureNaturalWidth;
var prepareWithSegments = Pretext.prepareWithSegments;

(function () {
  'use strict';

  var stage   = document.getElementById('stage');
  var box     = document.getElementById('box');
  var content = document.getElementById('boxContent');
  var countEl = document.getElementById('charCount');
  var statusEl = document.getElementById('status');
  var handles = box.querySelectorAll('.handle');

  // Flatten the lookup table once into parallel arrays sorted by budget.
  var KEYS = Object.keys(window.lookupTable)
    .map(Number)
    .filter(function (n) { return isFinite(n); })
    .sort(function (a, b) { return a - b; });
  var TEXTS = KEYS.map(function (k) { return String(window.lookupTable[k]); });
  // Pretext follows white-space: normal, so repeated whitespace is one cell.
  // Keeping these lengths lets us discard entries that cannot possibly fit
  // before doing any text layout work.
  var NORMALIZED_LENGTHS = TEXTS.map(function (text) {
    return text.trim().replace(/\s+/g, ' ').length;
  });

  var CURSORS = {
    n: 'ns-resize', e: 'ew-resize', w: 'ew-resize',
    nw: 'nwse-resize', ne: 'nesw-resize'
  };

  var minW = 48, minH = 44;
  var padX = 0, padY = 0;
  var interacted = false;
  var lineHeight = 21.75;
  var cellWidth = 9;
  var pretextFont = '';
  var pretextOptions = { letterSpacing: 0 };
  var preparedTexts = new Array(TEXTS.length);
  var flowLineEls = [];
  var apples = [];

  var APPLE_SIZE = 44;
  var APPLE_RADIUS = APPLE_SIZE / 2;
  var APPLE_WRAP_RADIUS = APPLE_RADIUS + 5;
  var APPLE_COLLISION_RADIUS = 19.5;
  var EARTH_GRAVITY = 9.80665;       // m/s², standard gravity
  var APPLE_MASS_KG = 0.18;          // a medium 180 g apple
  var APPLE_RADIUS_METERS = 0.04;    // 8 cm physical diameter
  var WATER_DENSITY = 1000;          // kg/m³ at ordinary conditions
  var WATER_DRAG_COEFFICIENT = 0.47; // sphere approximation
  var PIXELS_PER_METER = APPLE_COLLISION_RADIUS / APPLE_RADIUS_METERS;
  var APPLE_VOLUME_M3 = 4 / 3 * Math.PI * Math.pow(APPLE_RADIUS_METERS, 3);
  var APPLE_AREA_M2 = Math.PI * Math.pow(APPLE_RADIUS_METERS, 2);
  var APPLE_FIXTURE_DENSITY = APPLE_MASS_KG / APPLE_AREA_M2;
  var PHYSICS_STEP = 1 / 120;
  var WALL_THICKNESS = 24;

  var physicsWorld = new Physics.World({
    gravity: Physics.Vec2(0, EARTH_GRAVITY)
  });
  physicsWorld.setAllowSleeping(true);
  physicsWorld.setContinuousPhysics(true);
  var dragAnchorBody = physicsWorld.createBody();
  var vesselBodies = [];
  var activeDrags = Object.create(null);

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* ------------------------------------------------------------- metrics */

  function canvasFont(cs) {
    var parts = [];
    if (cs.fontStyle !== 'normal') parts.push(cs.fontStyle);
    if (cs.fontVariant !== 'normal') parts.push(cs.fontVariant);
    parts.push(cs.fontWeight, cs.fontSize, cs.fontFamily);
    return parts.join(' ');
  }

  // Derive the smallest sensible box and synchronize Pretext with the live
  // typography. Prepared text remains cached until that typography changes.
  function measure() {
    var bs = getComputedStyle(box);
    var cs = getComputedStyle(content);

    padX = parseFloat(bs.paddingLeft) + parseFloat(bs.paddingRight);
    padY = parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom);
    var borderX = parseFloat(bs.borderLeftWidth) + parseFloat(bs.borderRightWidth);
    var borderY = parseFloat(bs.borderTopWidth) + parseFloat(bs.borderBottomWidth);

    var fontSize = parseFloat(cs.fontSize) || 15;
    lineHeight = parseFloat(cs.lineHeight);
    if (!isFinite(lineHeight)) lineHeight = fontSize * 1.45;

    minH = Math.ceil(lineHeight + padY + borderY);
    minW = Math.ceil(fontSize * 0.65 + padX + borderX);

    var font = canvasFont(cs);
    var letterSpacing = parseFloat(cs.letterSpacing);
    if (!isFinite(letterSpacing)) letterSpacing = 0;

    if (font !== pretextFont || letterSpacing !== pretextOptions.letterSpacing) {
      pretextFont = font;
      pretextOptions = { letterSpacing: letterSpacing };
      preparedTexts = new Array(TEXTS.length);

      // The displayed typeface is monospace, so one measured cell gives an
      // exact upper bound on how many normalized characters the box can hold.
      var cell = prepareWithSegments('0', pretextFont, pretextOptions);
      cellWidth = measureNaturalWidth(cell) || fontSize * 0.6;
    }
  }

  /* ------------------------------------------------------------ geometry */

  function stageW() { return stage.clientWidth; }
  function stageH() { return stage.clientHeight; }

  function geom() {
    return { l: box.offsetLeft, t: box.offsetTop, w: box.offsetWidth, h: box.offsetHeight };
  }

  function setGeom(w, h) {
    box.style.left   = Math.round((stageW() - w) / 2) + 'px';
    box.style.top    = '';
    box.style.width  = Math.round(w) + 'px';
    box.style.height = Math.round(h) + 'px';
    syncVesselBodies();
    wakeApples();
  }

  // Width changes symmetrically around the fixed horizontal centre. Height is
  // taken only from the open top, leaving the vessel floor anchored in place.
  function resizeFrom(dir, start, dx, dy) {
    var w = start.w, h = start.h;
    var sw = stageW(), sh = stageH();

    if (dir.indexOf('e') !== -1) {
      w = clamp(start.w + dx * 2, minW, Math.max(minW, sw));
    }
    if (dir.indexOf('w') !== -1) {
      w = clamp(start.w - dx * 2, minW, Math.max(minW, sw));
    }
    if (dir.indexOf('n') !== -1) {
      h = clamp(start.h - dy, minH, Math.max(minH, sh));
    }

    setGeom(w, h);
    return geom();
  }

  function centerBox() {
    var sw = stageW(), sh = stageH();
    var w = clamp(360, minW, Math.max(minW, sw - 24));
    // Tall, narrow phone screens get a proportionally taller box; on a desktop
    // stage the 240px floor wins and the default is unchanged.
    var h = clamp(Math.max(240, sh * 0.42), minH, Math.max(minH, sh - 24));
    setGeom(w, h);
  }

  function clampIntoStage() {
    var sw = stageW(), sh = stageH(), g = geom();
    var w = clamp(g.w, minW, Math.max(minW, sw));
    var h = clamp(g.h, minH, Math.max(minH, sh));
    setGeom(w, h);
  }

  /* ------------------------------------------------------------- fitting */

  function fits(i, cw, ch) {
    if (cw + 0.5 < cellWidth) return false;
    if (!preparedTexts[i]) {
      preparedTexts[i] = prepareWithSegments(TEXTS[i], pretextFont, pretextOptions);
    }
    return layoutText(preparedTexts[i], cw, lineHeight).height <= ch + 0.5;
  }

  // Walk longest-to-shortest instead of assuming that differently worded
  // entries fit monotonically. Pretext does the actual multiline layout; the
  // cheap cell-capacity check skips entries that are mathematically too long.
  function findBestFit(cw, ch) {
    if (!TEXTS.length || cellWidth <= 0 || lineHeight <= 0) return -1;

    var columns = Math.floor((cw + 0.5) / cellWidth);
    var rows = Math.floor((ch + 0.5) / lineHeight);
    var capacity = columns * rows;

    for (var i = TEXTS.length - 1; i >= 0; i--) {
      if (NORMALIZED_LENGTHS[i] <= capacity && fits(i, cw, ch)) return i;
    }
    return -1;
  }

  function circleIntervalForBand(circle, top, bottom) {
    var dy = 0;
    if (circle.cy < top) dy = top - circle.cy;
    else if (circle.cy > bottom) dy = circle.cy - bottom;
    if (dy >= circle.r) return null;

    var halfWidth = Math.sqrt(circle.r * circle.r - dy * dy);
    return { left: circle.cx - halfWidth, right: circle.cx + halfWidth };
  }

  // Turn every text line into one or more horizontal slots by carving the
  // falling apples out of it. A line can therefore continue on both sides of
  // an apple instead of treating the whole row as unavailable.
  function buildFlowBands(cw, ch, obstacles) {
    var bands = [];
    var rows = Math.floor((ch + 0.5) / lineHeight);
    var capacity = 0;

    for (var row = 0; row < rows; row++) {
      var top = row * lineHeight;
      var bottom = top + lineHeight;
      var blocked = [];

      for (var i = 0; i < obstacles.length; i++) {
        var interval = circleIntervalForBand(obstacles[i], top, bottom);
        if (!interval || interval.right <= 0 || interval.left >= cw) continue;
        blocked.push({
          left: clamp(interval.left, 0, cw),
          right: clamp(interval.right, 0, cw)
        });
      }

      blocked.sort(function (a, b) { return a.left - b.left; });
      var merged = [];
      for (var j = 0; j < blocked.length; j++) {
        var last = merged[merged.length - 1];
        if (last && blocked[j].left <= last.right) {
          last.right = Math.max(last.right, blocked[j].right);
        } else {
          merged.push({ left: blocked[j].left, right: blocked[j].right });
        }
      }

      var slots = [];
      var left = 0;
      for (var k = 0; k < merged.length; k++) {
        if (merged[k].left - left + 0.5 >= cellWidth) {
          slots.push({ left: left, width: merged[k].left - left });
        }
        left = Math.max(left, merged[k].right);
      }
      if (cw - left + 0.5 >= cellWidth) {
        slots.push({ left: left, width: cw - left });
      }

      for (var s = 0; s < slots.length; s++) {
        capacity += Math.floor((slots[s].width + 0.5) / cellWidth);
      }
      bands.push({ top: top, slots: slots });
    }

    return { bands: bands, capacity: capacity };
  }

  function layoutInBands(prepared, bands, fallbackWidth, collectLines) {
    var cursor = { segmentIndex: 0, graphemeIndex: 0 };
    var lines = collectLines ? [] : null;

    for (var row = 0; row < bands.length; row++) {
      var slots = bands[row].slots;
      for (var s = 0; s < slots.length; s++) {
        var line = layoutNextLine(prepared, cursor, slots[s].width);
        if (line === null) return { complete: true, lines: lines || [] };
        if (lines) {
          lines.push({
            left: slots[s].left,
            top: bands[row].top,
            width: slots[s].width,
            text: line.text
          });
        }
        cursor = line.end;
      }
    }

    return {
      complete: layoutNextLine(prepared, cursor, fallbackWidth) === null,
      lines: lines || []
    };
  }

  function findBestFlow(cw, flow) {
    for (var i = TEXTS.length - 1; i >= 0; i--) {
      if (NORMALIZED_LENGTHS[i] > flow.capacity) continue;
      if (!preparedTexts[i]) {
        preparedTexts[i] = prepareWithSegments(TEXTS[i], pretextFont, pretextOptions);
      }
      var result = layoutInBands(preparedTexts[i], flow.bands, cw, true);
      if (result.complete) return { index: i, lines: result.lines };
    }
    return { index: -1, lines: [] };
  }

  function syncFlowLines(lines, text) {
    if (!content.classList.contains('is-flowing')) {
      content.textContent = '';
      content.classList.add('is-flowing');
      flowLineEls = [];
    }

    while (flowLineEls.length < lines.length) {
      var el = document.createElement('span');
      el.className = 'text-line';
      content.appendChild(el);
      flowLineEls.push(el);
    }

    for (var i = 0; i < flowLineEls.length; i++) {
      var lineEl = flowLineEls[i];
      var line = lines[i];
      if (!line) {
        lineEl.style.display = 'none';
        continue;
      }
      lineEl.style.display = 'block';
      lineEl.style.left = line.left + 'px';
      lineEl.style.top = line.top + 'px';
      lineEl.style.width = line.width + 'px';
      lineEl.className = 'text-line' + (i < lines.length - 1 ? ' is-justified' : '');
      if (lineEl.textContent !== line.text) lineEl.textContent = line.text;
    }

    content.setAttribute('aria-label', text);
  }

  function showResult(index, lines) {
    var key = index >= 0 ? KEYS[index] : 0;
    var text = index >= 0 ? TEXTS[index] : '';

    if (lines) {
      syncFlowLines(lines, text);
    } else {
      if (content.classList.contains('is-flowing')) {
        content.classList.remove('is-flowing');
        content.textContent = '';
        flowLineEls = [];
      }
      content.removeAttribute('aria-label');
      if (content.textContent !== text) content.textContent = text;
    }

    if (countEl.textContent !== String(key)) countEl.textContent = key;
    announce(key);
  }

  function render() {
    var cw = box.clientWidth - padX;
    var ch = box.clientHeight - padY;
    var obstacles = getAppleObstacles();

    if (cw <= 0 || ch <= 0) {
      showResult(-1, obstacles.length ? [] : null);
      return;
    }

    if (obstacles.length) {
      var result = findBestFlow(cw, buildFlowBands(cw, ch, obstacles));
      showResult(result.index, result.lines);
    } else {
      showResult(findBestFit(cw, ch), null);
    }
  }

  // Announce only once the resize settles, so a drag is not read out frame
  // by frame.
  var announceTimer, announced = null;
  function announce(key) {
    if (key === announced) return;
    clearTimeout(announceTimer);
    announceTimer = setTimeout(function () {
      announced = key;
      statusEl.textContent = key
        ? 'Gravity explained in ' + key + ' characters'
        : 'Box too small to show any text';
    }, 400);
  }

  // The box's own size change is the single trigger for re-fitting, so drags,
  // keyboard nudges and window clamps all funnel through one path.
  var renderQueued = 0;
  function queueRender() {
    if (renderQueued) return;
    renderQueued = requestAnimationFrame(function () {
      renderQueued = 0;
      render();
    });
  }

  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(queueRender).observe(box);
  }

  /* --------------------------------------------------------------- apples */

  function getAppleObstacles() {
    if (!apples.length) return [];

    var rect = content.getBoundingClientRect();
    var obstacles = [];
    for (var i = 0; i < apples.length; i++) {
      var apple = apples[i];
      if (apple.x + APPLE_WRAP_RADIUS <= rect.left ||
          apple.x - APPLE_WRAP_RADIUS >= rect.right ||
          apple.y + APPLE_WRAP_RADIUS <= rect.top ||
          apple.y - APPLE_WRAP_RADIUS >= rect.bottom) continue;

      obstacles.push({
        cx: apple.x - rect.left,
        cy: apple.y - rect.top,
        r: APPLE_WRAP_RADIUS
      });
    }
    return obstacles;
  }

  function positionApple(apple) {
    apple.el.style.transform =
      'translate3d(' + Math.round(apple.x - APPLE_RADIUS) + 'px,' +
      Math.round(apple.y - APPLE_RADIUS) + 'px,0) rotate(' +
      apple.angle.toFixed(1) + 'deg)';
  }

  // ------------------------------------------------------------ splash art
  // A splash is a flipbook drawn on a fixed 17x8 character grid: bottom row is
  // the water line, centre column is the point of impact. No glyph is ever
  // moved -- a droplet appears to fly because the next frame draws it one cell
  // further out. Frames are written bottom up and stored without their empty
  // top rows; splashFrame pads them back so every frame is the same height.
  var SPLASH_ROWS = 8;            // .ascii-splash anchors on this row count
  var SPLASH_FRAME_MS = 52;       // a hair under two display frames each
  var SPLASH_CROWN_SPEED = 2.2;   // m/s; below this an apple only plops

  function splashFrame(rows) {
    var lead = SPLASH_ROWS - rows.length;
    return (lead > 0 ? new Array(lead + 1).join('\n') : '') + rows.join('\n');
  }

  // Fast entry: the surface punctures, a crown climbs and throws off droplets,
  // the jet collapses, and the droplets arc back down into spreading rings.
  var SPLASH_CROWN = [
    ['~~~~~~~-v-~~~~~~~'],
    ['       .:.',
     '~~~~~~~\\_/~~~~~~~'],
    ['        .',
     '     \\  |  /',
     '~~~~~~\\_|_/~~~~~~'],
    ['        .',
     '        \'',
     '    o   |   o',
     '    \\   |   /',
     '~~~~~\\__|__/~~~~~'],
    ['        .',
     '        \'',
     '  o  .  |  .  o',
     '        |',
     '   \\    |    /',
     '    \\   |   /',
     '~~~~~\\__|__/~~~~~'],
    [' o  .       .  o',
     '',
     '        .',
     '',
     '',
     '     \\  \'  /',
     '~~~-~~\\___/~~-~~~'],
    ['o   .       .   o',
     '',
     '',
     '        .',
     '       ._.',
     '~~~~-~~~~~~~-~~~~'],
    ['o   .       .   o',
     '',
     '',
     '~~~-~~~~v~~~~-~~~'],
    ['    .       .',
     'v~-~~~~~~~~~~~-~v'],
    ['~-~~v~~~~~~~v~~-~'],
    ['-~~~-~~~~~~~-~~~-']
  ].map(splashFrame);

  // Slow entry: a stub of a crown, two droplets, and the rings.
  var SPLASH_PLOP = [
    ['~~~~~~~~v~~~~~~~~'],
    ['       . .',
     '~~~~~~~\\_/~~~~~~~'],
    ['     .     .',
     '      \\ | /',
     '~~~~~~~\\_/~~~~~~~'],
    ['    o       o',
     '',
     '',
     '       ._.',
     '~~~~~-~~~~~-~~~~~'],
    ['   .         .',
     '',
     '~~~-~~~~~~~~~-~~~'],
    ['~-~v~~~~~~~~~v~-~'],
    ['-~~~~~~~~~~~~~~~-']
  ].map(splashFrame);

  var reducedMotion = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : null;

  var liveSplashes = [];
  var splashFrameId = 0;

  function splashAt(x, y, speed) {
    var frames = speed >= SPLASH_CROWN_SPEED ? SPLASH_CROWN : SPLASH_PLOP;
    var splash = document.createElement('pre');
    splash.className = 'ascii-splash';
    splash.setAttribute('aria-hidden', 'true');
    splash.style.left = Math.round(x) + 'px';
    splash.style.top = Math.round(y) + 'px';
    splash.textContent = frames[0];
    document.body.appendChild(splash);

    // Reduced motion gets the aftermath rather than the flipbook.
    if (reducedMotion && reducedMotion.matches) {
      splash.textContent = frames[frames.length - 1];
      window.setTimeout(function () { splash.remove(); }, 300);
      return;
    }

    liveSplashes.push({ el: splash, frames: frames, index: 0, start: 0 });
    if (!splashFrameId) splashFrameId = requestAnimationFrame(animateSplashes);
  }

  // One ticker drives every splash on screen; it runs independently of the
  // apple loop so a ripple still plays out after the apples have gone to sleep.
  function animateSplashes(now) {
    for (var i = liveSplashes.length - 1; i >= 0; i--) {
      var splash = liveSplashes[i];
      if (!splash.start) splash.start = now;

      var index = Math.floor((now - splash.start) / SPLASH_FRAME_MS);
      if (index >= splash.frames.length) {
        splash.el.remove();
        liveSplashes.splice(i, 1);
        continue;
      }
      if (index === splash.index) continue;

      splash.index = index;
      splash.el.textContent = splash.frames[index];

      // The tail frames dim, so the last rings settle instead of blinking out.
      var remaining = splash.frames.length - index;
      splash.el.style.opacity = remaining < 4 ? remaining / 4 : '';
    }
    splashFrameId = liveSplashes.length ? requestAnimationFrame(animateSplashes) : 0;
  }

  var appleFrame = 0;
  var lastAppleTime = 0;
  var physicsAccumulator = 0;

  function ensureAppleFrame() {
    if (appleFrame) return;
    lastAppleTime = 0;
    physicsAccumulator = 0;
    appleFrame = requestAnimationFrame(animateApples);
  }

  function endAppleDrag(pointerId) {
    var drag = activeDrags[pointerId];
    if (!drag) return;
    physicsWorld.destroyJoint(drag.joint);
    delete activeDrags[pointerId];
    drag.apple.dragPointer = null;
    drag.apple.el.classList.remove('is-dragging');
  }

  function makeAppleDraggable(apple) {
    apple.el.addEventListener('pointerdown', function (e) {
      if ((e.pointerType === 'mouse' && e.button !== 0) || apple.dragPointer != null) return;
      e.preventDefault();
      e.stopPropagation();

      var target = Physics.Vec2(e.clientX / PIXELS_PER_METER, e.clientY / PIXELS_PER_METER);
      var joint = new Physics.MouseJoint({
        maxForce: apple.body.getMass() * 300,
        frequencyHz: 7,
        dampingRatio: 0.88
      }, dragAnchorBody, apple.body, target);
      physicsWorld.createJoint(joint);
      activeDrags[e.pointerId] = { apple: apple, joint: joint };
      apple.dragPointer = e.pointerId;
      apple.el.classList.add('is-dragging');
      apple.body.setAwake(true);
      ensureAppleFrame();
      try { apple.el.setPointerCapture(e.pointerId); } catch (err) {}
    });

    apple.el.addEventListener('pointermove', function (e) {
      var drag = activeDrags[e.pointerId];
      if (!drag || drag.apple !== apple) return;
      e.preventDefault();
      drag.joint.setTarget(Physics.Vec2(
        e.clientX / PIXELS_PER_METER,
        e.clientY / PIXELS_PER_METER
      ));
      apple.body.setAwake(true);
      ensureAppleFrame();
    });

    function finish(e) {
      if (!activeDrags[e.pointerId]) return;
      e.preventDefault();
      endAppleDrag(e.pointerId);
      try { apple.el.releasePointerCapture(e.pointerId); } catch (err) {}
    }

    apple.el.addEventListener('pointerup', finish);
    apple.el.addEventListener('pointercancel', finish);
    apple.el.addEventListener('lostpointercapture', finish);
  }

  function removeApple(apple, index) {
    if (apple.dragPointer != null) endAppleDrag(apple.dragPointer);
    physicsWorld.destroyBody(apple.body);
    apple.el.remove();
    apples.splice(index, 1);
  }

  function addVesselBox(x, y, width, height) {
    var body = physicsWorld.createBody({
      type: 'static',
      position: Physics.Vec2(x / PIXELS_PER_METER, y / PIXELS_PER_METER)
    });
    body.createFixture(
      new Physics.Box(width / PIXELS_PER_METER / 2, height / PIXELS_PER_METER / 2),
      { friction: 0.42, restitution: 0.04 }
    );
    vesselBodies.push(body);
  }

  function syncVesselBodies() {
    for (var i = 0; i < vesselBodies.length; i++) {
      physicsWorld.destroyBody(vesselBodies[i]);
    }
    vesselBodies = [];

    var rect = box.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) return;

    // These three rigid bodies form a U: the top is genuinely open. Walls sit
    // outside the visible glass, so their inner faces match its exact edges.
    var wallHeight = rect.height + WALL_THICKNESS;
    addVesselBox(
      rect.left - WALL_THICKNESS / 2,
      rect.top + wallHeight / 2,
      WALL_THICKNESS,
      wallHeight
    );
    addVesselBox(
      rect.right + WALL_THICKNESS / 2,
      rect.top + wallHeight / 2,
      WALL_THICKNESS,
      wallHeight
    );
    addVesselBox(
      rect.left + rect.width / 2,
      rect.bottom + WALL_THICKNESS / 2,
      rect.width,
      WALL_THICKNESS
    );
  }

  function wakeApples() {
    if (!apples.length) return;
    for (var i = 0; i < apples.length; i++) apples[i].body.setAwake(true);
    ensureAppleFrame();
  }

  function applyWaterForces(water, vessel) {
    for (var i = 0; i < apples.length; i++) {
      var body = apples[i].body;
      if (!body.isAwake()) continue;

      var position = body.getPosition();
      var x = position.x * PIXELS_PER_METER;
      var y = position.y * PIXELS_PER_METER;
      var overWater = x > vessel.left && x < vessel.right;
      var submergedDepth = overWater
        ? clamp(
            position.y + APPLE_RADIUS_METERS - water.top / PIXELS_PER_METER,
            0,
            APPLE_RADIUS_METERS * 2
          )
        : 0;
      // Exact volume fraction of a submerged spherical cap.
      var submerged = Math.pow(submergedDepth, 2) *
        (3 * APPLE_RADIUS_METERS - submergedDepth) /
        (4 * Math.pow(APPLE_RADIUS_METERS, 3));

      if (submerged > 0 && y - APPLE_RADIUS < vessel.bottom) {
        var velocity = body.getLinearVelocity();
        var speed = Math.sqrt(velocity.x * velocity.x + velocity.y * velocity.y);
        var buoyancyForce = WATER_DENSITY * EARTH_GRAVITY *
          APPLE_VOLUME_M3 * submerged;
        var dragForce = speed > 0
          ? 0.5 * WATER_DENSITY * WATER_DRAG_COEFFICIENT *
            APPLE_AREA_M2 * speed * speed * submerged
          : 0;
        body.applyForceToCenter(Physics.Vec2(
          speed > 0 ? -dragForce * velocity.x / speed : 0,
          -buoyancyForce + (speed > 0 ? -dragForce * velocity.y / speed : 0)
        ), false);
        body.setAngularDamping(0.04 + submerged * 3);
      } else {
        body.setAngularDamping(0.04);
      }
    }
  }

  function checkForSplash(apple, water, vessel, now) {
    var overWater = apple.x > vessel.left && apple.x < vessel.right;
    var touchesWater = overWater &&
      apple.y + APPLE_COLLISION_RADIUS >= water.top &&
      apple.y - APPLE_COLLISION_RADIUS < vessel.bottom;

    if (touchesWater && !apple.inWater) {
      var downwardSpeed = apple.body.getLinearVelocity().y;
      if (downwardSpeed > 0.8 && now - apple.lastSplash > 450) {
        splashAt(clamp(apple.x, vessel.left, vessel.right), water.top, downwardSpeed);
        apple.lastSplash = now;
      }
      apple.inWater = true;
    } else if (!overWater ||
        apple.y + APPLE_COLLISION_RADIUS < water.top - 4 ||
        apple.y - APPLE_COLLISION_RADIUS > vessel.bottom) {
      apple.inWater = false;
    }
  }

  function animateApples(now) {
    var dt = lastAppleTime ? Math.min((now - lastAppleTime) / 1000, 0.05) : 0;
    lastAppleTime = now;
    var water = content.getBoundingClientRect();
    var vessel = box.getBoundingClientRect();
    physicsAccumulator = Math.min(physicsAccumulator + dt, 0.1);

    while (physicsAccumulator >= PHYSICS_STEP) {
      applyWaterForces(water, vessel);
      physicsWorld.step(PHYSICS_STEP, 10, 6);
      physicsAccumulator -= PHYSICS_STEP;
    }

    for (var i = apples.length - 1; i >= 0; i--) {
      var apple = apples[i];
      var position = apple.body.getPosition();
      apple.x = position.x * PIXELS_PER_METER;
      apple.y = position.y * PIXELS_PER_METER;
      apple.angle = apple.body.getAngle() * 180 / Math.PI;
      checkForSplash(apple, water, vessel, now);
      positionApple(apple);

      // Spilled apples have no floor outside the vessel. Once their top has
      // crossed the viewport floor they are gone, both visually and physically.
      if (apple.y - APPLE_RADIUS > window.innerHeight) {
        removeApple(apple, i);
      }
    }

    // The obstacle geometry changes with every physics step, so wrapping and
    // the selected character budget are recomputed in the same animation frame.
    render();

    if (apples.some(function (apple) { return apple.body.isAwake(); })) {
      appleFrame = requestAnimationFrame(animateApples);
    } else {
      appleFrame = 0;
      lastAppleTime = 0;
    }
  }

  function dropApple() {
    var rect = content.getBoundingClientRect();
    var minX = rect.left + APPLE_RADIUS;
    var maxX = rect.right - APPLE_RADIUS;
    var x = maxX > minX ? minX + Math.random() * (maxX - minX) : rect.left + rect.width / 2;
    var el = document.createElement('span');
    var y = -APPLE_RADIUS - 4 - Math.random() * 18;
    var angle = (-18 + Math.random() * 36) * Math.PI / 180;
    var body = physicsWorld.createDynamicBody({
      position: Physics.Vec2(x / PIXELS_PER_METER, y / PIXELS_PER_METER),
      angle: angle,
      bullet: true,
      linearDamping: 0.001,
      angularDamping: 0.04
    });
    body.createFixture(new Physics.Circle(APPLE_RADIUS_METERS), {
      density: APPLE_FIXTURE_DENSITY,
      friction: 0.38,
      restitution: 0.14
    });
    body.setAngularVelocity((-80 + Math.random() * 160) * Math.PI / 180);
    var apple = {
      el: el,
      body: body,
      x: x,
      y: y,
      angle: angle * 180 / Math.PI,
      dragPointer: null,
      inWater: false,
      lastSplash: -Infinity
    };

    el.className = 'apple';
    el.setAttribute('aria-hidden', 'true');
    el.textContent = '🍎';
    document.body.appendChild(el);
    apples.push(apple);
    makeAppleDraggable(apple);
    positionApple(apple);

    ensureAppleFrame();
  }

  // Distinguish a tap/click from a resize drag so grabbing a handle does not
  // accidentally rain apples. The release can be retargeted by pointer capture,
  // hence the window-level listeners.
  var tapStarts = Object.create(null);
  window.addEventListener('pointerdown', function (e) {
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest && e.target.closest('.apple')) return;
    tapStarts[e.pointerId] = { x: e.clientX, y: e.clientY, moved: false };
  }, true);

  window.addEventListener('pointermove', function (e) {
    var tap = tapStarts[e.pointerId];
    if (!tap || tap.moved) return;
    var dx = e.clientX - tap.x;
    var dy = e.clientY - tap.y;
    if (dx * dx + dy * dy > 100) tap.moved = true;
  }, true);

  window.addEventListener('pointerup', function (e) {
    var tap = tapStarts[e.pointerId];
    delete tapStarts[e.pointerId];
    if (tap && !tap.moved) dropApple();
  }, true);

  window.addEventListener('pointercancel', function (e) {
    delete tapStarts[e.pointerId];
  }, true);

  /* ------------------------------------------------------------ dragging */

  function markInteracted() {
    if (interacted) return;
    interacted = true;
    document.documentElement.classList.add('has-interacted');
  }

  Array.prototype.forEach.call(handles, function (handle) {
    var dir = handle.getAttribute('data-dir');

    handle.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      markInteracted();

      // Pointer capture keeps the drag alive past the box edge and past the
      // window, and retargets every move/up to this element: no document-level
      // listener juggling, and no touch lost to a fast flick.
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}

      var start = geom();
      var sx = e.clientX, sy = e.clientY;
      var frame = 0, latest = null;

      measure();
      box.classList.add('is-resizing');
      handle.setAttribute('data-active', '');
      document.documentElement.classList.add('no-select');
      document.body.style.cursor = CURSORS[dir] || '';
      function onMove(ev) {
        latest = ev;
        if (frame) return;
        frame = requestAnimationFrame(function () {
          frame = 0;
          resizeFrom(dir, start, latest.clientX - sx, latest.clientY - sy);
        });
      }

      function onEnd() {
        if (frame) { cancelAnimationFrame(frame); frame = 0; }
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onEnd);
        handle.removeEventListener('pointercancel', onEnd);
        box.classList.remove('is-resizing');
        handle.removeAttribute('data-active');
        document.documentElement.classList.remove('no-select');
        document.body.style.cursor = '';
        try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
      }

      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onEnd);
      handle.addEventListener('pointercancel', onEnd);
    });
  });

  /* ---------------------------------------------------------------- boot */

  function debounce(fn, wait) {
    var timer;
    return function () {
      clearTimeout(timer);
      timer = setTimeout(fn, wait);
    };
  }

  window.addEventListener('resize', debounce(function () {
    measure();
    // An untouched vessel returns to its responsive default. Once the reader
    // has sized it, preserve those dimensions within the new viewport; its
    // centre and floor remain anchored in either case.
    if (interacted) clampIntoStage(); else centerBox();
    queueRender();
  }, 120));

  measure();
  centerBox();
  render();
  box.classList.add('is-ready');

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measure(); render(); });
  }
})();
</script>
